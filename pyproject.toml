[project]
name = "mlprep"
version = "0.1.0"
description = "ML preparation project"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "wandb",
    "tqdm"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
