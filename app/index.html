/* Playground: edit a curriculum script and run the WHOLE edited file. The
   feedback loop is deliberately the file's own gradient checks and asserts  - 
   green means every check in the script passed, not that "an answer matched".
   Edits run from a scratch copy; the repo file is never modified. */
async function viewLab(app, path) {
  const epoch = routeEpoch;
  app.innerHTML = spinner('Loading ' + esc(path) + '…');
  let doc;
  try { doc = await api('/api/source?path=' + encodeURIComponent(path)); }
  catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
  if (epoch !== routeEpoch) return;
  const draftKey = 'mlprep.draft.lab.' + path;
  const draft = store.get(draftKey, null);
  const startVal = (typeof draft === 'string' && draft !== doc.content) ? draft : doc.content;
  app.innerHTML = `
  <div class="flex flex-col h-full">
    <div class="flex items-center gap-3 px-4 h-12 border-b border-line bg-panel">
      <a href="#/notes/${encodeURIComponent(path)}" class="text-xs text-mut hover:text-accent">← read-only view</a>
      <span class="font-mono text-[13px] font-semibold text-zinc-100">${esc(path)}</span>
      <span class="text-[11px] text-mut hidden md:inline truncate">edits run from a scratch copy - the repo file is untouched.
        Make the file prove your change: extend its own checks (gradient check, asserts), then Run.</span>
      <div class="ml-auto flex items-center gap-2 shrink-0">
        <button id="lab-reset" class="btn btn-secondary !py-1 text-xs">Reset to original</button>
        <button id="lab-run" class="btn btn-primary">Run ⌘⏎</button>
      </div>
    </div>
    <div id="lab-draft-bar" style="display:none"
         class="bar-warn px-4 py-1.5 text-xs text-warn items-center gap-3">
      <span>Draft restored from your last visit.</span>
      <button id="lab-draft-discard" class="underline hover:opacity-80">discard</button>
    </div>
    <div id="lab-editor" class="flex-1 min-h-0 relative"></div>
    <div id="lab-result" role="status" aria-live="polite" class="border-t border-line max-h-[45%] overflow-y-auto"></div>
  </div>`;

  let cm = null;
  const getCode = () => cm ? cm.getValue() : $('#lab-ta').value;
  const setCode = v => cm ? cm.setValue(v) : ($('#lab-ta').value = v);
  if (window.CodeMirror) {
    cm = CodeMirror($('#lab-editor'), {
      value: startVal, mode: 'python', lineNumbers: true, autofocus: true,
      theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
      indentUnit: 4, tabSize: 4, indentWithTabs: false,
      extraKeys: { 'Cmd-Enter': () => run(), 'Ctrl-Enter': () => run(),
                   Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    ') },
    });
    window._cm = cm;
  } else {
    $('#lab-editor').innerHTML = `<textarea id="lab-ta" spellcheck="false"
      class="w-full h-full bg-panel p-3 font-mono text-sm outline-none resize-none"></textarea>`;
    $('#lab-ta').value = startVal;
  }
  // run works from anywhere on the page, not just inside the editor
  const labKeyH = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  };
  document.addEventListener('keydown', labKeyH);

  /* draft autosave (localStorage, per path, debounced) */
  let saveT = null;
  const flushDraft = () => {
    try {
      const v = getCode();
      if (v === doc.content) localStorage.removeItem(draftKey); else store.set(draftKey, v);
    } catch (e) {}
  };
  const queueSave = () => { clearTimeout(saveT); saveT = setTimeout(flushDraft, 500); };
  if (cm) cm.on('change', queueSave);
  else $('#lab-ta').addEventListener('input', queueSave);
  if (startVal !== doc.content) {
    const bar = $('#lab-draft-bar');
    bar.style.display = 'flex';
    $('#lab-draft-discard').onclick = () => {
      try { localStorage.removeItem(draftKey); } catch (e) {}
      setCode(doc.content); bar.style.display = 'none';
    };
  }
  cleanup = () => { clearTimeout(saveT); flushDraft();
                    document.removeEventListener('keydown', labKeyH); };

  async function run() {
    const btn = $('#lab-run');
    if (!btn || btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Running…';
    $('#lab-result').innerHTML = `<div class="p-4 text-sm text-mut animate-pulse">
      Running the full edited file - its own asserts and checks are the verdict…</div>`;
    let r;
    try { r = await api('/api/runfile', { path, code: getCode() }); }
    catch (e) {
      if (epoch !== routeEpoch) return;
      $('#lab-result').innerHTML = errBox(e); btn.disabled = false; btn.textContent = 'Run ⌘⏎'; return;
    }
    if (epoch !== routeEpoch) return;
    btn.disabled = false; btn.textContent = 'Run ⌘⏎';
    const closeBtn = `<button id="lab-close" title="Hide this panel (Esc)"
      class="btn btn-text ml-auto text-mut text-xs">✕ hide</button>`;
    $('#lab-result').innerHTML = r.ok
      ? `<div class="p-4 rise">
           <div class="p-3 rounded-xl soft-good flex items-center gap-3 text-good font-semibold text-sm">✓ Exit 0 - every check in the file passed
             <span class="text-mut font-normal tnum">(${r.elapsed_ms} ms)</span>${closeBtn}</div>
           ${r.output ? `<pre class="mt-3 text-xs bg-panel border border-line rounded-lg p-3 overflow-x-auto whitespace-pre-wrap">${esc(r.output)}</pre>` : ''}
         </div>`
      : `<div class="p-4 rise">
           <div class="p-3 rounded-xl soft-bad flex items-center gap-3 text-bad font-semibold text-sm">✕ Failed
             <span class="text-mut font-normal tnum">(${r.elapsed_ms} ms)</span>${closeBtn}</div>
           <pre class="mt-3 text-xs bg-panel border border-line rounded-lg p-3 overflow-x-auto whitespace-pre-wrap text-bad">${esc(r.error)}</pre>
           ${r.output ? `<pre class="mt-2 text-xs bg-panel border border-line rounded-lg p-3 overflow-x-auto whitespace-pre-wrap">${esc(r.output)}</pre>` : ''}
         </div>`;
    $('#lab-close').onclick = () => { $('#lab-result').innerHTML = ''; (cm || $('#lab-ta')).focus(); };
  }
  $('#lab-run').onclick = run;
  $('#lab-reset').onclick = () => {
    if (!confirm('Discard your edits and reload the original file?')) return;
    setCode(doc.content);
    try { localStorage.removeItem(draftKey); } catch (e) {}
    const bar = $('#lab-draft-bar'); if (bar) bar.style.display = 'none';
  };
}

/* --------------------------------------------------------- view: notebook */
/* Jupyter-style cells over a curriculum file: .ipynb files use their own
   cells verbatim; .py scripts are split at their section banners. Each cell
   runs in one persistent kernel process, so state (imports, defs, arrays)
   carries from cell to cell. Cell edits are session-only; the repo file is
   never written. */
const stopKernel = sid => {
  if (!sid) return;
  const body = JSON.stringify({ session: sid });
  if (navigator.sendBeacon) {
    try {
      navigator.sendBeacon('/api/nb/stop', new Blob([body], { type: 'application/json' }));
      return;
    } catch (e) {}
  }
  try {
    fetch('/api/nb/stop', { method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' }, body });
  } catch (e) {}
};

/* .py prose cell source -> readable text: comment markers and banner rules
   are stripped; a module docstring keeps its text as-is (md() renders both).
   .ipynb prose cells are already markdown and skip this entirely. */
function proseText(src) {
  const lines = src.replace(/\s+$/, '').split('\n');
  const head = [];
  let i = 0;
  while (i < lines.length && /^\s*(#|$)/.test(lines[i])) {
    if (!/^\s*#\s*[-=]{3,}/.test(lines[i])) head.push(lines[i].replace(/^\s*#\s?/, ''));
    i++;
  }
  let tail = lines.slice(i).join('\n').trim();
  const m = tail.match(/^[A-Za-z]{0,2}("""|''')([\s\S]*?)\1$/);
  if (m) tail = m[2].trim();                    // docstring text, verbatim
  else if (tail) tail = tail.split('\n')        // stray comments after it
    .filter(l => !/^\s*#\s*[-=]{3,}/.test(l))
    .map(l => l.replace(/^\s*#\s?/, '')).join('\n');
  return [head.join('\n').trim(), tail].filter(Boolean).join('\n\n');
}

async function viewNb(app, path) {
  const epoch = routeEpoch;
  app.innerHTML = spinner('Loading notebook…');
  let doc, tree, session = null;
  try {
    [doc, tree] = await Promise.all([
      api('/api/nb/cells?path=' + encodeURIComponent(path)),
      getTree().catch(() => []),   // breadcrumb degrades, the notebook still opens
    ]);
    if (epoch !== routeEpoch) return;
    session = (await api('/api/nb/start', { path })).session;
  } catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
  if (epoch !== routeEpoch) { stopKernel(session); return; }
  const nav = docNav(tree, path);

  const S = { session, cells: [], counter: 0, busy: false, restarting: false, stopped: false };
  /* "ipynb": prose cells are real markdown, rendered as-is; "py": prose cells
     are comment/docstring blocks that go through proseText() first */
  const fmt = doc.format || 'py';

  markOpened(path, doc.title || (nav.entry && nav.entry.title) || path, nav.entry ? nav.entry.folderTitle : '');
  app.innerHTML = `
  <div id="doc-wrap" class="doc-wrap">
  ${sidebarHtml(tree, path)}
  <div class="max-w-4xl mx-auto p-6">
    ${crumbRow(nav, path, doc.title || (nav.entry && nav.entry.title) || path, '',
      doc.notes ? '#/notes/' + encodeURIComponent(doc.notes) : null, sbToggleBtn)}
    <div class="flex items-center gap-2 -mt-3 mb-5 text-xs">
      <span class="flex items-center gap-1.5 text-mut"
            title="Kernel state. Edits are session-only; the file on disk is untouched.">
        <span id="nb-dot" class="inline-block w-2 h-2 rounded-full bg-good"></span>
        <span id="nb-status" class="tnum">idle</span>
      </span>
      <div class="ml-auto flex items-center gap-2">
        <button id="nb-runall" class="btn btn-primary !py-1">Run all</button>
        <button id="nb-restart" class="btn btn-secondary !py-1">Restart</button>
        <a class="btn btn-secondary !py-1" href="#/notes/${encodeURIComponent(path)}"
           title="Read-only view">Source</a>
      </div>
    </div>
    <div id="nb-cells"></div>
    <div class="mt-1">
      <button id="nb-add" class="btn btn-text text-mut text-sm" title="Append an empty scratch cell (this session only)">+ add cell</button>
    </div>
    ${docFooter(nav)}
  </div>
  </div>`;
  mountSidebar($('#doc-wrap'));

  /* kernel status: dot + label, elapsed ticking while a cell runs */
  let statT = null;
  const setStatus = st => {
    const dot = $('#nb-dot'), lab = $('#nb-status');
    if (!dot || !lab) return;
    clearInterval(statT); statT = null;
    if (st === 'running' || st === 'restarting') {
      dot.className = 'inline-block w-2 h-2 rounded-full bg-warn animate-pulse';
      if (st === 'restarting') { lab.textContent = 'restarting…'; return; }
      const t0 = Date.now();
      const tick = () => {
        const l = $('#nb-status');
        if (l) l.textContent = 'running ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s';
      };
      statT = setInterval(tick, 100); tick();
    } else if (st === 'dead') {
      dot.className = 'inline-block w-2 h-2 rounded-full bg-bad';
      lab.textContent = 'dead';
    } else {
      dot.className = 'inline-block w-2 h-2 rounded-full bg-good';
      lab.textContent = 'idle';
    }
  };

  const cellsEl = $('#nb-cells');
  const code = c => c.cm ? c.cm.getValue() : c.ta.value;

  function makeCell(source, kind) {
    const i = S.cells.length;
    if (kind === 'prose') {
      /* reading prose, not an editor: no card chrome, no gutter number, not
         runnable; "view source" keeps the raw text one click away */
      const el = document.createElement('div');
      el.className = 'nb-prose group mb-4 pl-14 pr-2';
      el.innerHTML = `
        <div class="md text-[.92rem]">${md(fmt === 'ipynb' ? source : proseText(source))}</div>
        <button class="nb-src-btn btn btn-text text-mut text-xs opacity-0 group-hover:opacity-100 focus-visible:opacity-100">view source</button>
        <pre class="nb-src hidden mt-1 p-3 rounded-lg text-xs font-mono whitespace-pre overflow-x-auto bg-[var(--pre-bg)] text-[var(--pre-text)] border border-[var(--code-border)]"></pre>`;
      el.querySelector('.nb-src').textContent = source.replace(/\n+$/, '');
      cellsEl.appendChild(el);
      const btn = el.querySelector('.nb-src-btn'), pre = el.querySelector('.nb-src');
      btn.onclick = () => {
        const hidden = pre.classList.toggle('hidden');
        btn.textContent = hidden ? 'view source' : 'hide source';
      };
      const cell = { el, kind: 'prose', cm: null, ta: null, order: null };
      S.cells.push(cell);
      return cell;
    }
    const el = document.createElement('div');
    /* gutter OUTSIDE the card so every box on the page (cards, prose, fenced
       blocks in markdown) shares one left edge; run numbers hang in the
       reserved left rail like a classic notebook */
    el.className = 'flex items-stretch mb-3';
    el.innerHTML = `
      <div class="nb-gut w-14 shrink-0 pt-3 pr-3 text-right text-[11px] font-mono tnum text-mut select-none">[&nbsp;]</div>
      <div class="card flex-1 min-w-0 overflow-hidden">
        <div class="nb-ed py-1.5 pr-2"></div>
        <div class="nb-out hidden border-t border-line">
          <pre class="nb-stdout hidden px-4 py-3 text-xs font-mono whitespace-pre-wrap overflow-x-auto text-[var(--pre-text)]"></pre>
          <pre class="nb-stderr hidden mx-3 my-2.5 p-3 rounded-lg soft-bad text-bad text-xs font-mono whitespace-pre-wrap overflow-x-auto"></pre>
          <div class="nb-ms microlabel text-mut px-4 pb-2 pt-0.5 tnum"></div>
        </div>
      </div>`;
    cellsEl.appendChild(el);
    const cell = {
      el, kind: 'code',
      gut: el.querySelector('.nb-gut'), out: el.querySelector('.nb-out'),
      so: el.querySelector('.nb-stdout'), se: el.querySelector('.nb-stderr'),
      ms: el.querySelector('.nb-ms'), cm: null, ta: null, order: null,
    };
    const host = el.querySelector('.nb-ed');
    /* trailing blank separator lines belong to the file, not the cell UI */
    const display = source.replace(/\n+$/, '');
    if (window.CodeMirror) {
      cell.cm = CodeMirror(host, {
        value: display, mode: 'python', lineNumbers: false,
        theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
        viewportMargin: Infinity,
        indentUnit: 4, tabSize: 4, indentWithTabs: false,
        extraKeys: {
          'Shift-Enter': () => { runCell(i, true); },
          'Cmd-Enter': () => { runCell(i, false); },
          'Ctrl-Enter': () => { runCell(i, false); },
          Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    '),
        },
      });
      cell.cm.setSize(null, 'auto');
    } else {
      const ta = document.createElement('textarea');
      ta.spellcheck = false;
      ta.value = display;
      ta.rows = Math.max(3, display.split('\n').length + 1);
      ta.className = 'w-full bg-panel font-mono text-sm p-3 outline-none resize-y';
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.shiftKey || e.metaKey || e.ctrlKey)) {
          e.preventDefault(); runCell(i, e.shiftKey);
        }
      });
      host.appendChild(ta);
      cell.ta = ta;
    }
    S.cells.push(cell);
    return cell;
  }

  function setGutter(cell, txt, spin) {
    cell.gut.textContent = txt;
    cell.gut.classList.toggle('animate-pulse', !!spin);
  }
  function showOut(cell, r) {
    cell.out.classList.remove('hidden', 'opacity-50');
    cell.so.classList.toggle('hidden', !r.stdout);
    cell.so.textContent = r.stdout || '';
    const bad = [r.stderr, r.error].filter(Boolean).join('\n');
    cell.se.classList.toggle('hidden', !bad);
    cell.se.textContent = bad;
    cell.ms.textContent = (r.elapsed_ms != null) ? r.elapsed_ms + ' ms' : '';
  }
  /* quiet hint in the cell's output area (kernel busy / dead / expired) */
  function hint(cell, msg) {
    cell.out.classList.remove('hidden', 'opacity-50');
    cell.se.classList.remove('hidden');
    cell.se.textContent = msg;
    cell.ms.textContent = '';
  }
  function markAllUnrun() {
    S.counter = 0;
    S.cells.forEach(c => {
      if (c.kind === 'prose') return;
      c.order = null;
      setGutter(c, '[ ]', false);
      /* outputs stay visible, but faded until their cell is re-run */
      if (!c.out.classList.contains('hidden')) c.out.classList.add('opacity-50');
    });
  }

  async function restartKernel() {
    if (S.restarting) return;
    S.restarting = true;
    setStatus('restarting');
    try { await api('/api/nb/restart', { session: S.session }); }
    catch (e) {
      /* session reaped or evicted: fall back to a brand-new kernel */
      try { S.session = (await api('/api/nb/start', { path })).session; }
      catch (e2) {
        if (epoch === routeEpoch) setStatus('dead');
        S.restarting = false;
        return;
      }
    }
    S.restarting = false;
    if (epoch !== routeEpoch) return;
    markAllUnrun();
    setStatus('idle');
  }

  /* returns true when the cell ran cleanly (run-all stops on anything else) */
  async function runCell(i, advance) {
    const cell = S.cells[i];
    if (!cell) return false;
    if (cell.kind === 'prose') return true;   // prose never runs
    if (S.busy) { hint(cell, 'kernel busy: a cell is already running'); return false; }
    S.busy = true;
    setStatus('running');
    setGutter(cell, '[*]', true);
    let r = null, threw = null;
    try { r = await api('/api/nb/run', { session: S.session, code: code(cell) }); }
    catch (e) { threw = e; }
    S.busy = false;
    if (epoch !== routeEpoch) return false;
    setGutter(cell, cell.order ? '[' + cell.order + ']' : '[ ]', false);
    if (threw) {
      const m = String(threw.message || threw);
      if (/unknown session/i.test(m)) {
        /* reaped after 30 min idle, or LRU-evicted: start fresh, then rerun */
        try { S.session = (await api('/api/nb/start', { path })).session; }
        catch (e2) { if (epoch === routeEpoch) { hint(cell, m); setStatus('dead'); } return false; }
        if (epoch !== routeEpoch) return false;
        markAllUnrun();
        hint(cell, 'kernel session expired, a fresh kernel was started: run cells again from the top');
      } else if (/kernel busy/i.test(m)) {
        hint(cell, 'kernel busy: wait for the running cell to finish');
      } else {
        hint(cell, m);
      }
      setStatus('idle');
      return false;
    }
    if (r.dead) {
      /* timed out or crashed: the server killed the process, respawn it so
         the next run works, then surface the error where it happened */
      await restartKernel();
      if (epoch !== routeEpoch) return false;
      hint(cell, r.error || 'kernel died: run cells again');
      return false;
    }
    S.counter += 1;
    cell.order = S.counter;
    setGutter(cell, '[' + S.counter + ']', false);
    showOut(cell, r);
    setStatus('idle');
    if (advance && r.ok) {
      /* focus moves to the next CODE cell (prose is skipped); none created */
      let j = i + 1;
      while (j < S.cells.length && S.cells[j].kind === 'prose') j++;
      const nxt = S.cells[j];
      if (nxt) { (nxt.cm || nxt.ta).focus(); nxt.el.scrollIntoView({ block: 'nearest' }); }
    }
    return !!r.ok;
  }

  async function runAll() {
    if (S.busy || S.restarting) return;
    for (let i = 0; i < S.cells.length; i++) {
      if (S.cells[i].kind === 'prose') continue;
      const ok = await runCell(i, false);
      if (epoch !== routeEpoch) return;
      if (!ok) { S.cells[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    }
  }

  (doc.cells.length ? doc.cells : [{ source: '', kind: 'code' }])
    .forEach(c => makeCell(c.source, c.kind || 'code'));
  $('#nb-runall').onclick = runAll;
  $('#nb-restart').onclick = restartKernel;
  $('#nb-add').onclick = () => { const c = makeCell('', 'code'); (c.cm || c.ta).focus(); };

  /* the theme toggle only re-themes window._cm; a notebook has many editors,
     so watch the html class and re-theme them all (window._cm stays null) */
  const themeObs = new MutationObserver(() => {
    const th = document.documentElement.classList.contains('dark') ? 'material-darker' : 'default';
    S.cells.forEach(c => c.cm && c.cm.setOption('theme', th));
  });
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  const navKeyH = docNavKeys(nav);
  document.addEventListener('keydown', navKeyH);
  const stopOnce = () => { if (!S.stopped) { S.stopped = true; stopKernel(S.session); } };
  window.addEventListener('pagehide', stopOnce);
  cleanup = () => {
    clearInterval(statT);
    themeObs.disconnect();
    document.removeEventListener('keydown', navKeyH);
    window.removeEventListener('pagehide', stopOnce);
    stopOnce();
  };
}

/* ------------------------------------------------------------ view: cards */
/* Flashcards. Landing: two quick actions (a mixed review drawn from every
   deck, and the cards missed before) above a grid of deck tiles, each with
   its last score. Study: one card at a time with a progress bar; the card
   flips in place to the answer, then "Missed" / "Got it" grade it. Misses
   persist across sessions (browser-only) and feed the Missed deck. */
const CARD_LAST = 'mlprep.cards.last', CARD_MISSED = 'mlprep.cards.missed';
const cardKey = c => c.slug + '#' + c.n;
function parseSection(s) {
  const m = String(s).match(/^(\d+)\.\s*(.*?)\s*(?:\(([^)]*)\))?\s*$/);
  return m ? { num: +m[1], name: m[2], tag: m[3] || '' } : { num: 0, name: String(s), tag: '' };
}
function shuffled(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
async function viewCards(app, slug) {
  const epoch = routeEpoch;
  app.innerHTML = spinner('Loading flashcards…');
  let cards;
  try { cards = await getCards(); } catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
  if (epoch !== routeEpoch) return;
  const sections = [...new Map(cards.map(c => [c.slug, c.section])).entries()];
  const missedSet = store.get(CARD_MISSED, {});
  const missedCards = cards.filter(c => missedSet[cardKey(c)]);
  const MIXED_N = 20;

  if (!slug) {
    const last = store.get(CARD_LAST, {});
    const action = (href, icon, i, title, sub, off) => `
      <${off ? 'div' : `a href="${href}"`} class="tile !flex-row items-center gap-4 ${off ? 'no-lift opacity-60' : ''}">
        <span class="badge-num !w-11 !h-11 !rounded-xl" style="${tint(i)}">${icon}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-[15px] font-semibold text-zinc-100">${title}</span>
          <span class="block text-[13px] text-mut">${sub}</span>
        </span>
        ${off ? '' : `<span class="text-mut inline-flex">${ICON.chevR}</span>`}
      </${off ? 'div' : 'a'}>`;
    const deckTile = ([s, title], i) => {
      const p = parseSection(title), n = cards.filter(c => c.slug === s).length, L = last[s];
      const pct = L ? Math.round(100 * L.got / L.total) : 0;
      return `<a href="#/cards/${esc(s)}" class="tile">
        <div class="flex items-center justify-between mb-4">
          <span class="badge-num" style="${tint(i)}">${p.num || esc(p.name[0])}</span>
          ${p.tag ? `<span class="font-mono text-[11px] text-mut">${esc(p.tag)}</span>` : ''}
        </div>
        <div class="text-[17px] font-semibold tracking-tight leading-snug text-zinc-100">${esc(p.name)}</div>
        <div class="text-[13px] text-mut mt-1 tnum">${n} cards</div>
        <div class="mt-auto pt-4">${L ? `
          <div class="flex justify-between text-[12px] text-mut tnum mb-1.5">
            <span>Last run: ${L.got} of ${L.total}</span><span>${ago(L.t)}</span></div>
          <div class="meter"><i style="width:${pct}%;${L.got === L.total ? 'background:#2cbb5d' : ''}"></i></div>`
          : '<div class="text-[12px] text-mut">Not studied yet</div>'}
        </div>
      </a>`;
    };
    app.innerHTML = `
    <div class="max-w-5xl mx-auto px-6 py-10">
      <h1 class="page-title">Flashcards</h1>
      <p class="text-[14px] text-mut mt-1 mb-7">${cards.length} cards in ${sections.length} decks. Answer out loud
        before revealing; a hesitation counts as a miss.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10">
        ${action('#/cards/mixed', ICON.shuffle, 1, 'Mixed review',
                 `${MIXED_N} random cards from all ${sections.length} decks`)}
        ${action('#/cards/missed', ICON.redo, 5, 'Missed cards',
                 missedCards.length ? `${missedCards.length} to review again` : 'Cards you miss collect here',
                 !missedCards.length)}
      </div>
      <h2 class="sec-title mb-3">Decks</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${sections.map(deckTile).join('')}</div>
    </div>`;
    return;
  }

  let deck, deckName;
  if (slug === 'mixed') { deck = shuffled(cards).slice(0, MIXED_N); deckName = 'Mixed review'; }
  else if (slug === 'missed') { deck = missedCards; deckName = 'Missed cards'; }
  else { deck = cards.filter(c => c.slug === slug); deckName = deck.length ? parseSection(deck[0].section).name : ''; }
  if (!deck.length) {
    app.innerHTML = slug === 'missed'
      ? `<div class="max-w-md mx-auto px-6 py-16 text-center rise">
          <h1 class="page-title mb-2">No missed cards</h1>
          <p class="text-[14px] text-mut mb-6">Cards you mark Missed collect here for another pass.</p>
          <a href="#/cards" class="btn btn-primary btn-lg">All decks</a></div>`
      : errBox(new Error('unknown deck: ' + slug));
    return;
  }
  const mixedDeck = slug === 'mixed' || slug === 'missed';
  let full = deck;
  const state = { i: 0, flipped: false, got: 0, missed: [] };

  const actions = () => {
    const el = $('#c-actions');
    if (!el) return;
    el.innerHTML = state.flipped
      ? `<button id="c-miss" class="btn btn-lg soft-bad text-bad font-semibold">Missed<span class="kbd">1</span></button>
         <button id="c-got" class="btn btn-lg soft-good text-good font-semibold">Got it<span class="kbd">2</span></button>`
      : `<button id="c-show" class="btn btn-lg btn-primary">Show answer<span class="kbd">Space</span></button>`;
    if (state.flipped) {
      $('#c-miss').onclick = () => grade('fail');
      $('#c-got').onclick = () => grade('pass');
    } else $('#c-show').onclick = flip;
  };
  const flip = () => {
    state.flipped = !state.flipped;
    const card = $('#card');
    if (card) card.classList.toggle('is-flipped', state.flipped);
    actions();
  };
  const render = () => {
    if (epoch !== routeEpoch) return;   // guard against renders after navigation
    if (state.i >= deck.length) return renderDone();
    const c = deck[state.i], p = parseSection(c.section);
    app.innerHTML = `
    <div class="max-w-2xl mx-auto px-6 py-8">
      <div class="flex items-center gap-2 mb-3">
        <a href="#/cards" class="btn btn-text text-mut !px-1.5 text-[13px]">${ICON.chevL}<span>Decks</span></a>
        <div class="flex-1 text-center text-[14px] font-semibold text-zinc-100 truncate">${esc(deckName)}</div>
        <div class="text-[13px] text-mut tnum w-[4.5rem] text-right">${state.i + 1} of ${deck.length}</div>
      </div>
      <div class="meter mb-7"><i style="width:${(100 * state.i / deck.length).toFixed(1)}%"></i></div>
      <div id="card" class="flip rise cursor-pointer select-none ${state.flipped ? 'is-flipped' : ''}"
           title="Click or press Space to flip">
        <div class="flip-inner">
          <div class="face front tile no-lift !rounded-[20px] !p-9 min-h-[18rem] justify-center">
            <div class="text-[12px] font-medium text-mut mb-4">${mixedDeck ? esc(p.name) : 'Question'}</div>
            <div class="text-[21px] font-semibold leading-snug tracking-tight text-zinc-100">${esc(c.question)}</div>
          </div>
          <div class="face back tile no-lift !rounded-[20px] !p-9 min-h-[18rem]">
            <div class="text-[12px] font-semibold text-accent mb-1.5">Answer</div>
            <div class="text-[13px] text-mut mb-4">${esc(c.question)}</div>
            <div class="md text-[.95rem]">${md(c.answer)}</div>
          </div>
        </div>
      </div>
      <div id="c-actions" class="mt-6 flex justify-center gap-3"></div>
      <p class="text-center text-[12px] text-mut mt-5">Grade yourself before flipping back: recognizing an answer is not the same as recalling it.</p>
    </div>`;
    fixMdLinks($('#card'), 'practice/flashcards.md');
    $('#card').onclick = e => { if (!e.target.closest('a')) flip(); };
    actions();
  };
  const renderDone = () => {
    const N = deck.length, R = 54, C = 2 * Math.PI * R, miss = state.missed.length;
    app.innerHTML = `
    <div class="max-w-xl mx-auto px-6 py-12 text-center rise">
      <svg width="148" height="148" viewBox="0 0 148 148" class="mx-auto mb-5" role="img"
           aria-label="${state.got} of ${N} recalled">
        <circle cx="74" cy="74" r="${R}" fill="none" stroke="var(--fill)" stroke-width="12"/>
        <circle cx="74" cy="74" r="${R}" fill="none" stroke="${miss ? 'var(--accent)' : '#2cbb5d'}" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="${(C * state.got / N).toFixed(1)} ${C.toFixed(1)}"
                transform="rotate(-90 74 74)"/>
        <text x="74" y="83" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor"
              class="tnum">${state.got}/${N}</text>
      </svg>
      <h1 class="page-title mb-1">${miss ? 'Deck complete' : 'Every card recalled'}</h1>
      <p class="text-[14px] text-mut mb-7">${esc(deckName)} · ${miss ? miss + ' missed' : 'no misses'}</p>
      <div class="flex gap-3 justify-center flex-wrap mb-8">
        ${miss ? `<button id="c-retry" class="btn btn-primary btn-lg">Review ${miss} missed</button>` : ''}
        <button id="c-restart" class="btn ${miss ? 'btn-secondary' : 'btn-primary'} btn-lg">Study again</button>
        <a href="#/cards" class="btn btn-text btn-lg text-mut">All decks</a>
      </div>
      ${miss ? `<div class="card !rounded-2xl text-left overflow-hidden divide-y divide-line">
        ${state.missed.map(c => `<div class="px-4 py-2.5 text-[13px] text-zinc-100">${esc(c.question)}</div>`).join('')}
      </div>` : ''}
    </div>`;
    const restart = d => { deck = d; state.i = 0; state.flipped = false; state.got = 0; state.missed = []; render(); };
    if (miss) $('#c-retry').onclick = () => restart(state.missed.slice());
    $('#c-restart').onclick = () => restart(slug === 'mixed' ? shuffled(cards).slice(0, MIXED_N) : full);
  };
  const grade = result => {
    const c = deck[state.i], m = store.get(CARD_MISSED, {});
    if (result === 'pass') { state.got++; delete m[cardKey(c)]; }
    else { state.missed.push(c); m[cardKey(c)] = Date.now(); }
    store.set(CARD_MISSED, m);
    state.i++; state.flipped = false;
    if (state.i >= deck.length && !mixedDeck && deck === full) {
      const L = store.get(CARD_LAST, {});
      L[slug] = { got: state.got, total: deck.length, t: Date.now() };
      store.set(CARD_LAST, L);
    }
    render();
  };
  const keyHandler = e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'A') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.i >= deck.length) return;
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (state.flipped && e.key === '1') grade('fail');
    else if (state.flipped && e.key === '2') grade('pass');
  };
  document.addEventListener('keydown', keyHandler);
  cleanup = () => document.removeEventListener('keydown', keyHandler);
  render();
}

</script>
</body>
</html>
