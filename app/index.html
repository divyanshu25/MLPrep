<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLPrep - Study App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
if (window.tailwind) tailwind.config = { theme: { extend: {
  colors: { base:'var(--base)', panel:'var(--panel)', panel2:'var(--panel2)', line:'var(--line)',
            accent:'#ffa116', good:'#2cbb5d', warn:'var(--warn)', bad:'#ef4743',
            mut:'var(--mut)' },
  // text-* utilities use WCAG-safe per-theme colors; bg-* and border-* keep the vivid values
  textColor: { accent:'var(--accent-text)', good:'var(--good-text)', bad:'var(--bad-text)' },
  fontFamily: { mono:['ui-monospace','SFMono-Regular','Menlo','Consolas','monospace'] }
}}};
// apply saved theme before first paint to avoid a flash (default: light)
document.documentElement.classList.toggle('dark', localStorage.getItem('mlprep-theme') === 'dark');
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>.katex-display{overflow-x:auto;overflow-y:hidden;padding:0.25rem 0}</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<style>
  /* Theme palettes: light is the default; html.dark switches to the dark look.
     Light = Apple white base + pure-white cards + hairline borders;
     dark = near-black base + elevated panels (elevation, not shadows). */
  :root {
    --base:#fbfbfd; --panel:#ffffff; --panel2:#f2f2f4; --line:rgba(0,0,0,.08);
    --warn:#c98f0a; --mut:#6b7280; --text:#1d1d1f; --text-strong:#111113;
    --code-bg:#f4f4f6; --code-border:rgba(0,0,0,.07); --code-text:#b45309;
    --pre-bg:#f6f7f9; --pre-text:#24292f; --th-bg:#fbfbfd;
    --quote:#57606a; --details-bg:#fafafc; --scroll:#d1d5db; --dot-todo:#c8cdd4;
    --accent-text:#b45309; --good-text:#15803d; --bad-text:#b91c1c;
    --accent:#ffa116;
    --nav-bg:rgba(251,251,253,.78);
    --shadow-card:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
  }
  html.dark {
    --base:#0d0d0f; --panel:#1c1c1f; --panel2:#26262b; --line:rgba(255,255,255,.09);
    --warn:#ffc01e; --mut:#9ca3af; --text:#e6e6ea; --text-strong:#f5f5f7;
    --code-bg:#26262b; --code-border:rgba(255,255,255,.1); --code-text:#fbbf24;
    --pre-bg:#141416; --pre-text:#d4d4d8; --th-bg:#202024;
    --quote:#a1a1aa; --details-bg:#202023; --scroll:#3f3f46; --dot-todo:#52525b;
    --accent:#ffa116; --accent-text:#ffa116; --good-text:#2cbb5d; --bad-text:#ef4743;
    --nav-bg:rgba(13,13,15,.72);
    --shadow-card:none;
  }
  /* Only #app and inner panes scroll: the page shell itself is locked so nothing
     (hidden helpers, momentum chaining) can scroll past the end of the content. */
  html, body { height:100%; overflow:hidden; }
  html { background:var(--base); }
  body { background:var(--base); color:var(--text); font-size:15px;
         font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .overflow-y-auto { overscroll-behavior-y: contain; }
  /* type scale helpers */
  .page-title { font-size:1.75rem; line-height:1.15; font-weight:700; letter-spacing:-.022em; color:var(--text-strong); }
  .tnum { font-variant-numeric:tabular-nums; }
  .microlabel { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
  /* legacy fixed-shade classes → semantic theme colors */
  .text-zinc-100, .text-zinc-200 { color:var(--text-strong) !important; }
  .text-zinc-300 { color:var(--text) !important; }
  .text-zinc-400 { color:var(--mut) !important; }
  .bg-zinc-600 { background-color:var(--dot-todo) !important; }
  /* focus + motion: visible keyboard focus everywhere, transitions only on
     hover/appear, and everything collapses under prefers-reduced-motion. */
  :focus-visible { outline:2px solid var(--accent-text); outline-offset:2px; border-radius:4px; }
  .CodeMirror *:focus-visible, #pal-q:focus-visible { outline:none; }
  a, button, select, input, summary { transition:background-color .15s ease, border-color .15s ease,
    color .15s ease, opacity .15s ease, box-shadow .15s ease, transform .15s ease; }
  button:active:not(:disabled) { transform:scale(.98); }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .rise { animation:rise .2s ease both; }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  /* frosted chrome (nav bar, command palette) */
  .frost { background:var(--nav-bg); -webkit-backdrop-filter:saturate(180%) blur(20px);
           backdrop-filter:saturate(180%) blur(20px); }
  .nav-tab { padding:.35rem .85rem; border-radius:9999px; color:var(--mut); font-weight:500; }
  .nav-tab:hover { color:var(--text-strong); background:var(--panel2); }
  .nav-tab.active { background:var(--panel2); color:var(--text-strong); font-weight:600; }
  /* button hierarchy: one filled accent primary per screen, quiet bordered
     secondaries, quiet text buttons for progressive disclosure. */
  .btn { display:inline-flex; align-items:center; gap:.4rem; border-radius:8px; font-size:.875rem;
         font-weight:500; padding:.42rem .9rem; border:1px solid transparent; cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn-primary { background:var(--accent); color:#1d1d1f; font-weight:600; }
  .btn-primary:hover:not(:disabled) { background:#ffab2e; }
  .btn-secondary { background:var(--panel); border-color:var(--line); color:var(--text); }
  .btn-secondary:hover:not(:disabled) { background:var(--panel2); }
  .btn-text { padding:.3rem .55rem; border-radius:6px; background:none; }
  .btn-text:hover:not(:disabled) { background:var(--panel2); }
  /* raised card surface */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-card); }
  /* toolbar fields: one consistent height */
  .field { height:2.25rem; background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:0 .7rem; font-size:.875rem; color:var(--text); }
  .field:focus { border-color:var(--accent); }
  /* tinted translucent surfaces for callouts / verdicts (theme-tuned, no harsh solids) */
  .soft-good { background:rgba(44,187,93,.1); border:1px solid rgba(44,187,93,.3); }
  .soft-bad { background:rgba(239,71,67,.08); border:1px solid rgba(239,71,67,.3); }
  .soft-warn { background:rgba(201,143,10,.07); border:1px solid rgba(201,143,10,.28); }
  html.dark .soft-warn { background:rgba(255,192,30,.08); border-color:rgba(255,192,30,.25); }
  .bar-warn { background:rgba(201,143,10,.07); border-bottom:1px solid rgba(201,143,10,.3); }
  html.dark .bar-warn { background:rgba(255,192,30,.08); border-bottom-color:rgba(255,192,30,.25); }
  /* difficulty pills: semantic colors stay green/amber/red */
  .diff-pill { font-size:12px; font-weight:600; text-transform:capitalize; padding:.14rem .6rem; border-radius:9999px; }
  .diff-pill.easy { color:var(--good-text); background:rgba(44,187,93,.12); }
  .diff-pill.medium { color:var(--warn); background:rgba(201,143,10,.1); }
  html.dark .diff-pill.medium { background:rgba(255,192,30,.12); }
  .diff-pill.hard { color:var(--bad-text); background:rgba(239,71,67,.1); }
  /* status dots get a subtle ring */
  .sdot { box-shadow:0 0 0 3px transparent; }
  .sdot.bg-good { box-shadow:0 0 0 3px rgba(44,187,93,.16); }
  .sdot.bg-warn { box-shadow:0 0 0 3px rgba(255,192,30,.18); }
  .sdot.bg-zinc-600 { box-shadow:0 0 0 3px rgba(120,120,128,.12); }
  .CodeMirror { height:100%; font-size:13.5px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .cm-s-material-darker.CodeMirror { background:#1e1e1e; }
  .cm-s-default.CodeMirror { background:#fff; border:1px solid var(--line); }
  /* notebook cells: editor sized to its content, chrome-free inside the card */
  .nb-ed .CodeMirror { height:auto; border:none; background:transparent; }
  /* markdown body: comfortable reading measure */
  .md { line-height:1.7; font-size:.9375rem; }
  .md h1 { font-size:1.45rem; font-weight:700; letter-spacing:-.015em; margin:1.2rem 0 .8rem; color:var(--text-strong); }
  .md h2 { font-size:1.17rem; font-weight:700; letter-spacing:-.01em; margin:1.6rem 0 .6rem; color:var(--text-strong);
           border-bottom:1px solid var(--line); padding-bottom:.3rem; }
  .md h3 { font-size:1.02rem; font-weight:600; margin:1.2rem 0 .5rem; color:var(--text-strong); }
  .md p { margin:.55rem 0; }
  .md ul, .md ol { margin:.55rem 0 .55rem 1.4rem; }
  .md ul { list-style:disc; } .md ol { list-style:decimal; }
  .md li { margin:.22rem 0; }
  .md a { color:var(--accent-text); text-decoration:underline; text-underline-offset:2px; }
  .md code { background:var(--code-bg); border:1px solid var(--code-border); border-radius:4px;
             padding:.08rem .3rem; font-size:.85em; font-family:ui-monospace,Menlo,monospace; color:var(--code-text); }
  .md pre { background:var(--pre-bg); border:1px solid var(--code-border); border-radius:10px;
            padding:.85rem 1rem; overflow-x:auto; margin:.75rem 0; }
  .md pre code { background:none; border:none; padding:0; color:var(--pre-text); font-size:13px; line-height:1.6; }
  /* fenced ```text example blocks render as distinct example cards */
  .md pre:has(> code.language-text) { background:var(--panel2); border:1px solid var(--line); }
  html.dark .md pre:has(> code.language-text) { background:var(--details-bg); }
  .md pre:has(> code.language-text) code { color:var(--text); }
  .md table { border-collapse:collapse; margin:.8rem 0; font-size:.86rem; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--code-border); padding:.4rem .7rem; text-align:left; vertical-align:top; }
  .md th { background:var(--th-bg); color:var(--text-strong); }
  /* blockquote Note/Constraints callouts: quiet, accent hairline, muted text */
  .md blockquote { border-left:2px solid var(--accent); padding:.1rem 0 .1rem .95rem;
                   color:var(--quote); margin:.9rem 0; font-size:.9rem; }
  .md blockquote strong { color:var(--text); }
  .md details { background:var(--details-bg); border:1px solid var(--code-border); border-radius:10px;
                padding:.5rem .9rem; margin:.6rem 0; }
  .md summary { cursor:pointer; color:var(--accent-text); font-weight:600; }
  .md hr { border-color:var(--line); margin:1.4rem 0; }
  .md input[type=checkbox] { accent-color:#ffa116; width:.95rem; height:.95rem; margin-right:.35rem; }
  .md img { max-width:100%; }
  /* reading view: centered ~72ch column; on wide viewports an "On this page"
     rail sits fixed on the right and the column re-centers in the remaining
     space (padding-right on the wrap). Below 1280px the rail collapses into
     a "Contents" details block at the top of the document instead. */
  .doc-outline { display:none; }
  .toc-link { display:block; padding:.2rem .6rem; border-left:2px solid transparent;
              color:var(--mut); font-size:12.5px; line-height:1.5; border-radius:0 6px 6px 0; }
  .toc-link:hover { color:var(--text-strong); background:var(--panel2); }
  .doc-outline .toc-link.active { color:var(--accent-text); border-left-color:var(--accent); font-weight:600; }
  .toc-link.lvl3 { padding-left:1.5rem; }
  @media (min-width:1280px) {
    .doc-wrap.has-outline { padding-right:17rem; }
    .doc-wrap.has-outline .doc-outline { display:block; position:fixed; top:4.5rem; right:1rem;
      width:15rem; max-height:calc(100vh - 6rem); overflow-y:auto; overscroll-behavior:contain;
      padding-bottom:1rem; }
    .doc-toc { display:none; }
  }
  /* roving keyboard highlight on the problems table */
  tr.rove { outline:2px solid var(--accent); outline-offset:-2px; background:rgba(255,161,22,.06); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body class="bg-base antialiased">

<div id="offline-banner" style="display:none;background:#7c2d12;color:#fed7aa;padding:8px 16px;
     font:13px system-ui;border-bottom:1px solid #9a3412;"></div>

<nav class="frost h-14 flex items-center gap-6 px-5 border-b border-line sticky top-0 z-20">
  <a href="#/problems" class="flex items-center gap-2 font-semibold text-[15px] tracking-tight text-zinc-100">
    <span>MLPrep</span>
  </a>
  <div class="flex items-center gap-1 text-sm" id="nav-tabs">
    <a href="#/problems" data-tab="problems" class="nav-tab">Problems</a>
    <a href="#/notes"    data-tab="notes"    class="nav-tab">Notes</a>
    <a href="#/cards"    data-tab="cards"    class="nav-tab">Cards</a>
  </div>
  <div class="ml-auto flex items-center gap-3 text-xs text-mut tnum" id="nav-progress"></div>
  <button id="palette-hint" class="btn btn-secondary !px-2.5 !py-1 text-xs text-mut"
          title="Jump to any problem, note, or deck" onclick="openPalette()">⌘K</button>
  <button id="theme-toggle" class="btn btn-secondary !px-2.5 !py-1 text-sm"
          title="Toggle light / dark theme"></button>
</nav>

<main id="app" class="h-[calc(100vh-3.5rem)] overflow-y-auto"></main>

<script>
'use strict';
/* ------------------------------------------------------------------ core */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Markdown + LaTeX. marked mangles math ($W_1$ -> italics, \\ eaten), so math
   spans are stashed behind placeholder tokens before parsing, typeset with
   KaTeX, and spliced back into the rendered HTML afterwards. Fenced code
   blocks are exempt so `$` in shell/code snippets is never treated as math. */
/* Rewrite links inside rendered markdown so relative repo links stay in the
   SPA: "01_foundations/notes.md" inside ml/README.md resolves against the
   current file's directory and becomes #/notes/ml/01_foundations/notes.md.
   External links open in a new tab; non-viewable repo files (images, data)
   become inert with a tooltip pointing at the editor. */
function fixMdLinks(container, basePath) {
  if (!container) return;
  container.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (/^(https?:|mailto:)/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (href.startsWith('#')) {
      /* in-page anchor: scroll to the slugified heading id ourselves - letting
         the raw fragment hit location.hash would bounce off the SPA router */
      a.addEventListener('click', ev => {
        ev.preventDefault();
        const frag = decodeURIComponent(href.slice(1));
        const el = document.getElementById(frag) || document.getElementById(slugify(frag));
        if (el) el.scrollIntoView({
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
          block: 'start' });
      });
      return;
    }
    let resolved;
    try { resolved = new URL(href, 'file:///' + basePath).pathname.replace(/^\//, ''); }
    catch (e) { return; }
    if (/\.(md|py|ipynb)$/.test(resolved)) {
      a.href = '#/notes/' + encodeURIComponent(resolved);
    } else {
      a.removeAttribute('href');
      a.title = 'not viewable in the app - open ' + resolved + ' in your editor';
      a.classList.add('cursor-help', 'opacity-70');
    }
  });
}

const md = t => {
  if (!window.marked) return '<pre>'+esc(t)+'</pre>';
  const stash = [];
  const hold = (tex, display) => {
    let html = null;
    if (window.katex) {
      try { html = katex.renderToString(tex, {displayMode: display, throwOnError: false}); }
      catch (e) { html = null; }
    }
    if (html === null) html = '<code>'+esc(display ? '$$'+tex+'$$' : '$'+tex+'$')+'</code>';
    stash.push(html);
    const tok = '@@MATH'+(stash.length-1)+'@@';
    return display ? '\n\n'+tok+'\n\n' : tok;
  };
  const guarded = t.split(/(```[\s\S]*?```)/g).map(seg => {
    if (seg.startsWith('```')) return seg;
    return seg
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => hold(tex.trim(), true))
      .replace(/(?<!\\)\$(?!\s)((?:\\.|[^$])+?)\$(?!\d)/g, (m, tex) =>
        /\n\s*\n/.test(tex) ? m : hold(tex.replace(/\n/g, ' '), false));
  }).join('');
  return marked.parse(guarded, {gfm:true}).replace(/@@MATH(\d+)@@/g, (_, i) => stash[+i]);
};
const DIFF_CLS = {easy:'text-good', medium:'text-warn', hard:'text-bad'};
const STATUS_DOT = {solved:'bg-good', attempted:'bg-warn', todo:'bg-zinc-600'};
const STATUS_TITLE = {solved:'Solved (accepted here)', attempted:'Attempted (rejected run or opened solution)', todo:'Not attempted'};

async function api(path, body) {
  const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                       body: JSON.stringify(body)} : undefined;
  const res = await fetch(path, opts);
  let data = null, parsed = false;
  try { data = await res.json(); parsed = true; } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || res.status + ' ' + res.statusText);
  if (!parsed) throw new Error('Unexpected non-JSON response from ' + path);
  return data;
}
const errBox = e => `<div class="m-6 p-4 rounded-xl soft-bad text-bad text-sm rise">
  <b>Error:</b> ${esc(e.message || e)}
  <a href="#/problems" class="ml-3 underline hover:opacity-80"
     onclick="if (history.length > 1) { event.preventDefault(); history.back(); }">← back</a></div>`;
const spinner = msg => `<div class="p-10 text-center text-mut text-sm animate-pulse">${esc(msg || 'Loading…')}</div>`;

/* problem status lives in localStorage - mlprep.status = {problemId: "solved"|"attempted"}.
   The server's queue-derived status field is ignored entirely; anything not in the
   local map is "todo". Accepted runs mark solved automatically; a rejected run or
   an opened solution marks attempted (never downgrading a solve). */
const STATUS_KEY = 'mlprep.status';
function setLocalStatus(id, s) {
  const m = store.get(STATUS_KEY, {});
  if (m[id] === 'solved' || m[id] === s) return;   // solved is sticky
  m[id] = s;
  store.set(STATUS_KEY, m);
}
let problemsCache = null;
async function getProblems(force) {
  if (force || !problemsCache) problemsCache = await api('/api/problems');
  const st = store.get(STATUS_KEY, {});
  return problemsCache.map(p => ({ ...p, status: st[p.id] || 'todo' }));
}
let cardsCache = null;
async function getCards() {
  if (!cardsCache) cardsCache = await api('/api/flashcards');
  return cardsCache;
}
let treeCache = null;
async function getTree() {
  if (!treeCache) treeCache = await api('/api/tree');
  return treeCache;
}
let nbIndexCache = null;
async function getNotebooks() {
  if (!nbIndexCache) nbIndexCache = await api('/api/notebooks');
  return nbIndexCache;
}

/* local (not UTC) YYYY-MM-DD */
const localISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
                    + '-' + String(d.getDate()).padStart(2, '0');
/* tiny FNV-1a hash, for stable per-text checklist keys */
function hashText(s) {
  let h = 2166136261;
  for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}

/* seeded daily shuffle: same order all day, new order tomorrow */
function dailyShuffle(arr) {
  let h = 2166136261;
  for (const c of localISO(new Date())) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rand = () => { h = Math.imul(h ^ h >>> 15, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
                       return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function fmtClock(sec) { return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

/* ---------------------------------------------------------------- router */
let cleanup = null;
/* Every navigation bumps the epoch; async views capture it on entry and bail
   before any post-await DOM write if the user has since routed elsewhere. */
let routeEpoch = 0;
window.addEventListener('hashchange', route);

function syncTheme() {
  const dark = document.documentElement.classList.contains('dark');
  const btn = $('#theme-toggle');
  if (btn) btn.textContent = dark ? '☀️' : '🌙';
  if (window._cm) window._cm.setOption('theme', dark ? 'material-darker' : 'default');
}
window.addEventListener('load', () => {
  $('#theme-toggle').onclick = () => {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('mlprep-theme', dark ? 'dark' : 'light');
    syncTheme();
  };
  syncTheme();
  const missing = [];
  if (!window.tailwind) missing.push('Tailwind');
  if (!window.marked) missing.push('marked (markdown)');
  if (!window.CodeMirror) missing.push('CodeMirror (editor)');
  if (!window.katex) missing.push('KaTeX (math will show as raw LaTeX)');
  if (missing.length) {
    const b = $('#offline-banner'); b.style.display = 'block';
    b.textContent = 'Offline? These CDN assets failed to load: ' + missing.join(', ') +
      '. The app still works, but with degraded styling / a plain-textarea editor / raw markdown.';
  }
  route();
});

function route() {
  routeEpoch++;
  window._cm = null;   // detached editors must not be re-themed by the toggle
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  const h = location.hash || '#/problems';
  const app = $('#app');
  app.scrollTop = 0;
  const tab = h.startsWith('#/lab') ? 'notes'
            : h.startsWith('#/nb') ? 'notes'
            : h.startsWith('#/notes') ? 'notes'
            : h.startsWith('#/cards') ? 'cards' : 'problems';
  $$('#nav-tabs a').forEach(a => a.className =
    'nav-tab' + (a.dataset.tab === tab ? ' active' : ''));
  updateNavProgress();
  if (h.startsWith('#/problem/')) viewProblem(app, decodeURIComponent(h.slice('#/problem/'.length)));
  else if (h.startsWith('#/lab/')) viewLab(app, decodeURIComponent(h.slice('#/lab/'.length)));
  else if (h.startsWith('#/nb/')) viewNb(app, decodeURIComponent(h.slice('#/nb/'.length)));
  else if (h.startsWith('#/notes')) viewNotes(app, h.slice('#/notes'.length).replace(/^\//, ''));
  else if (h.startsWith('#/cards')) viewCards(app, h.slice('#/cards'.length).replace(/^\//, ''));
  else viewProblems(app);   // #/problems + fallback for unknown hashes
}

/* ------------------------------------------------- global keys + palette */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault(); openPalette(); return;
  }
  if (e.key === 'Escape') {
    const pal = $('#palette');
    if (pal && !pal.classList.contains('hidden')) { closePalette(); return; }
    const lr = $('#lab-result');
    if (lr && lr.innerHTML.trim()) { lr.innerHTML = ''; return; }
    const r = $('#result');
    if (r && r.innerHTML.trim()) r.innerHTML = '';
  }
});

let palItems = null, palFiltered = [], palSel = 0;
function fuzzyScore(q, s) {
  if (!q) return 0;
  q = q.toLowerCase(); s = s.toLowerCase();
  let idx = -1, score = 0;
  for (const ch of q) {
    idx = s.indexOf(ch, idx + 1);
    if (idx < 0) return -1;
    score += idx;
  }
  return score;
}
function ensurePaletteDOM() {
  if ($('#palette')) return;
  const div = document.createElement('div');
  div.id = 'palette';
  div.className = 'hidden fixed inset-0 z-50';
  div.innerHTML = `
    <div id="pal-backdrop" class="absolute inset-0 bg-black/30"></div>
    <div class="frost relative max-w-xl mx-auto mt-28 border border-line rounded-[14px] shadow-2xl overflow-hidden rise">
      <input id="pal-q" placeholder="Jump to a problem, note, or flashcard deck…" autocomplete="off" spellcheck="false"
        class="w-full bg-transparent px-5 py-3.5 text-base outline-none border-b border-line placeholder:text-mut">
      <div id="pal-list" class="max-h-80 overflow-y-auto text-sm py-1.5"></div>
      <div class="px-5 py-2.5 text-[11px] text-mut border-t border-line flex gap-4">
        <span>↑↓ navigate</span><span>⏎ open</span><span>esc close</span>
      </div>
    </div>`;
  document.body.appendChild(div);
  $('#pal-backdrop').onclick = closePalette;
  $('#pal-q').oninput = () => { palSel = 0; renderPalette(); };
  $('#pal-q').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePal(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePal(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); openPalSel(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePalette(); }
  });
}
function renderPalette() {
  const list = $('#pal-list'); if (!list) return;
  const qs = $('#pal-q').value.trim();
  palFiltered = (palItems || [])
    .map(it => [fuzzyScore(qs, it.label + ' ' + it.sub), it])
    .filter(x => x[0] >= 0)
    .sort((a, b) => a[0] - b[0])
    .slice(0, 40).map(x => x[1]);
  if (palSel >= palFiltered.length) palSel = Math.max(0, palFiltered.length - 1);
  list.innerHTML = palFiltered.length
    ? palFiltered.map((it, i) => `
      <div class="pal-row mx-1.5 px-3.5 py-2 rounded-lg cursor-pointer flex items-center gap-2.5 ${i === palSel ? 'bg-panel2 text-zinc-100' : ''}" data-i="${i}">
        <span class="text-[10px] uppercase tracking-wide text-mut border border-line rounded-md px-1 py-0.5 w-16 text-center shrink-0">${it.kind}</span>
        <span class="truncate">${esc(it.label)}</span>
        <span class="text-xs text-mut truncate ml-auto">${esc(it.sub)}</span>
      </div>`).join('')
    : `<div class="px-4 py-6 text-center text-mut">${palItems ? 'No matches.' : 'Loading index…'}</div>`;
  $$('.pal-row').forEach(r => r.onclick = () => { palSel = +r.dataset.i; openPalSel(); });
  const sel = list.children[palSel];
  if (sel && palFiltered.length) sel.scrollIntoView({ block: 'nearest' });
}
function movePal(d) {
  if (!palFiltered.length) return;
  palSel = (palSel + d + palFiltered.length) % palFiltered.length;
  renderPalette();
}
function openPalSel() {
  const it = palFiltered[palSel];
  if (!it) return;
  closePalette();
  location.hash = it.hash;
}
function closePalette() {
  const pal = $('#palette');
  if (pal) { pal.classList.add('hidden'); $('#pal-q').blur(); }
}
async function openPalette() {
  ensurePaletteDOM();
  const pal = $('#palette');
  pal.classList.remove('hidden');
  const inp = $('#pal-q');
  inp.value = ''; palSel = 0;
  renderPalette();
  inp.focus();
  if (!palItems) {   // build the index lazily, once, from cached endpoints
    const items = [];
    try {
      (await getProblems()).forEach(p =>
        items.push({ kind: 'problem', label: p.name, sub: p.folder_title, hash: '#/problem/' + p.id }));
    } catch (e) {}
    try {
      /* .py and .ipynb files open as notebooks by default; .md stay read-only notes */
      (await getTree()).forEach(g => g.folders.forEach(f => f.files.forEach(x => {
        const nb = /\.(py|ipynb)$/.test(x.path);
        items.push({ kind: nb ? 'notebook' : 'note', label: x.title, sub: x.path,
                     hash: (nb ? '#/nb/' : '#/notes/') + encodeURIComponent(x.path) });
      })));
    } catch (e) {}
    try {
      const cards = await getCards();
      [...new Map(cards.map(c => [c.slug, c.section])).entries()].forEach(([s, t]) =>
        items.push({ kind: 'cards', label: t, sub: 'flashcard deck', hash: '#/cards/' + s }));
    } catch (e) {}
    palItems = items;
    if (!pal.classList.contains('hidden')) renderPalette();
  }
}

          </div>

  let saveT = null;

    try {

      if (v === p.stub) localStorage.removeItem(draftKey); else store.set(draftKey, v);

      (s >= boxSec ? 'text-bad font-bold' : s >= boxSec * 0.8 ? 'text-warn' : 'text-zinc-300');
    if (s >= boxSec) el.textContent += '  (box expired - take the hint ladder)';
  };
  const timerIv = setInterval(tick, 1000); tick();

  /* verdict: 'pass' after Accepted - ⏎ then jumps to the next unsolved problem */
  let verdict = null;
  const keyHandler = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && t.closest && t.closest('.CodeMirror, input, textarea, select, button')) return;
    if (verdict === 'pass' && e.key === 'Enter') {
      const nxt = $('#next-unsolved');
      if (nxt) { e.preventDefault(); nxt.click(); }
    }
  };
  document.addEventListener('keydown', keyHandler);
  cleanup = () => {
    clearInterval(timerIv);
    document.removeEventListener('keydown', keyHandler);
    clearTimeout(saveT);
    flushDraft();
  };

  /* progressive disclosure, tutor-ordered: hint first, then gated solution */
  $('#btn-hint').onclick = () => {
    const box = $('#hint-box');
    box.classList.remove('hidden');
    box.innerHTML = p.key_insight ? md(p.key_insight)
      : '<i>No separate key-insight note for this one - the reference solution is the next rung.</i>';
    $('#btn-hint').disabled = true; $('#btn-hint').classList.add('opacity-50');
  };

    const yes = $('#btn-sol-yes');
    if (yes.disabled) return;
    yes.disabled = true;
    $('#sol-confirm').classList.add('hidden');
    $('#sol-box').classList.remove('hidden');
    $('#btn-sol').disabled = true; $('#btn-sol').classList.add('opacity-50');

      ? 'Already solved - status unchanged.'
      : 'Marked attempted - come back for a cold re-attempt before counting it.';

  /* run + verdict */
  async function run() {

    if (r.ok) {
      verdict = 'pass';
      setLocalStatus(p.id, 'solved');                  // automatic - no button to click

      clearInterval(timerIv);                          // solve is over - freeze the clock
      try { sessionStorage.removeItem(tKey); } catch (e) {}
      $('#result').innerHTML = `

          <div>

            <span class="tnum">(${r.asserts} asserts)</span>
            <span class="text-xs opacity-75 tnum"> · judge ${r.elapsed_ms} ms · you ${fmtClock(solveSec)}</span>
            <div class="mt-0.5 text-xs opacity-75">marked solved</div>
          </div>
        </div>
        ${r.output ? `<pre class="mt-2 text-xs font-mono text-mut">${esc(r.output.trim())}</pre>` : ''}
        <div class="mt-3 flex items-center gap-3 flex-wrap">
          <span id="log-next" class="text-sm"></span>
          <button id="res-close" class="btn btn-text ml-auto text-mut text-xs" title="Hide this panel">✕ hide</button>
        </div>
      </div>`;
      $('#res-close').onclick = () => { $('#result').innerHTML = ''; verdict = null; };
      try {
        const ps = await getProblems();
        if (epoch !== routeEpoch) return;
        const nxt = ps.find(x => x.status === 'todo');
        const slot = $('#log-next');
        if (nxt && slot) {
          slot.innerHTML = `<a id="next-unsolved" class="text-accent hover:underline font-semibold"
            href="#/problem/${esc(nxt.id)}">Next unsolved: ${esc(nxt.name)} →</a>
            <span class="text-xs text-mut ml-1">⏎ next unsolved</span>`;
        }
      } catch (e) {}
    } else {
      verdict = 'fail';
      const wasSolved = (store.get(STATUS_KEY, {})[p.id] === 'solved');
      setLocalStatus(p.id, 'attempted');   // no-op if already solved
      updateNavProgress();
      $('#result').innerHTML = `
      <div class="p-4 rise">
        <div class="p-3.5 rounded-xl soft-bad text-bad text-sm flex items-start gap-2.5">
          <span aria-hidden="true" class="shrink-0 w-5 h-5 rounded-full bg-bad text-white text-[11px] font-bold flex items-center justify-center mt-px">✕</span>
          <div><span class="font-semibold">Rejected</span>
          <span class="ml-1 font-normal text-xs opacity-75">${wasSolved ? 'still solved' : 'marked attempted'}</span></div>
        </div>
        <pre class="mt-2 p-3 text-xs font-mono bg-panel border border-line rounded-lg overflow-auto max-h-64 whitespace-pre-wrap">${esc(r.error || 'no error output')}</pre>
        <div class="mt-3 flex items-center gap-3 flex-wrap">
          <button id="res-close" class="btn btn-text ml-auto text-mut text-xs" title="Hide this panel">✕ hide</button>
        </div>
      </div>`;
      $('#res-close').onclick = () => { $('#result').innerHTML = ''; verdict = null; };
    }
  }
  $('#btn-run').onclick = () => run();
}

/* ------------------------------------------------------------ view: notes */
/* Reading-first notes: #/notes is the module index landing; #/notes/<path>
   is a full-width centered document (no file tree). The cached /api/tree
   payload supplies the breadcrumb module title and the prev/next reading
   order; an h2/h3 outline rides along on wide viewports. */
function folderTitle(name) {
  return String(name || '').replace(/^\d+_/, '').replace(/_/g, ' ')
    .replace(/\b[a-z]/g, c => c.toUpperCase());
}
function slugify(t) {
  return String(t).toLowerCase().trim()
    .replace(/[^a-z0-9\s_-]+/g, '').trim().replace(/[\s_]+/g, '-') || 'section';
}
/* flatten the tree into reading order and locate a path's entry + neighbors */
function docNav(tree, path) {
  const flat = [];
  (tree || []).forEach(g => g.folders.forEach(f => f.files.forEach(x =>
    flat.push({ path: x.path, title: x.title, folder: f.name,
                folderTitle: folderTitle(f.name) }))));
  const i = flat.findIndex(e => e.path === path);
  return { entry: i >= 0 ? flat[i] : null,
           prev: i > 0 ? flat[i - 1] : null,
           next: i >= 0 && i < flat.length - 1 ? flat[i + 1] : null };
}
/* notebooks open as notebooks, everything else as read-only notes */
const docHash = e => (/\.(py|ipynb)$/.test(e.path) ? '#/nb/' : '#/notes/') + encodeURIComponent(e.path);
/* quiet single-row breadcrumb: Notes / module / title, filename in mono,
   compact prev/next arrows (plus any view-specific text buttons) at right */
function crumbRow(nav, path, title, extras) {
  const parts = path.split('/');
  const mod = nav.entry ? nav.entry.folderTitle
            : folderTitle(parts.length > 1 ? parts[parts.length - 2] : parts[0]);
  const pager = [['Previous', nav.prev, '←', '['], ['Next', nav.next, '→', ']']]
    .map(([dir, e, arrow, key]) => e
      ? `<a href="${docHash(e)}" class="btn btn-text text-mut !px-2"
           title="${esc(dir + ': ' + e.title)} (${key})">${arrow}</a>`
      : `<span class="btn btn-text !px-2 opacity-30 select-none" aria-hidden="true">${arrow}</span>`)
    .join('');
  return `
  <div class="flex items-center gap-x-2 gap-y-1 flex-wrap text-[13px] mb-6">
    <a href="#/notes" class="text-mut hover:text-accent">Notes</a>
    <span class="text-mut opacity-50" aria-hidden="true">/</span>
    <span class="text-mut">${esc(mod)}</span>
    <span class="text-mut opacity-50" aria-hidden="true">/</span>
    <span class="font-medium text-zinc-100">${esc(title)}</span>
    <span class="font-mono text-[11px] text-mut">${esc(parts[parts.length - 1])}</span>
    <div class="ml-auto flex items-center gap-1 shrink-0">${extras || ''}${pager}</div>
  </div>`;
}
/* end-of-document pager: full-title prev/next, keyboard hint in between;
   crossing a folder boundary labels next with the module it enters */
function docFooter(nav) {
  const prev = nav.prev
    ? `<a href="${docHash(nav.prev)}" class="btn btn-text text-sm text-left">← ${esc(nav.prev.title)}</a>`
    : '<span></span>';
  const crosses = nav.next && nav.entry && nav.next.folder !== nav.entry.folder;
  const next = nav.next
    ? `<a href="${docHash(nav.next)}" class="btn btn-text text-sm text-right">${esc(crosses ? 'Next module: ' + nav.next.folderTitle : nav.next.title)} →</a>`
    : '<span></span>';
  return `<div class="mt-10 pt-4 border-t border-line flex items-center justify-between gap-3">
    ${prev}
    <span class="text-[11px] text-mut shrink-0" title="keyboard shortcuts">[ prev · ] next</span>
    ${next}</div>`;
}
/* [ / ] navigate prev/next; ignored while typing in an editor or field */
function docNavKeys(nav) {
  return e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && t.closest && t.closest('.CodeMirror, input, textarea, select, [contenteditable]')) return;
    if (e.key === '[' && nav.prev) location.hash = docHash(nav.prev);
    else if (e.key === ']' && nav.next) location.hash = docHash(nav.next);
  };
}
/* Give every h2/h3 a stable slug id (duplicates get -2, -3, …), then, when
   there are >= 3 headings, build the outline twice from the same links: a
   fixed right rail (>= 1280px) and a "Contents" details block for narrower
   viewports. Returns the IntersectionObserver driving the active highlight
   (or null) so the caller can disconnect it on route cleanup. */
function buildOutline(rootEl, wrapEl, scrollRoot) {
  const seen = {};
  const hs = Array.from(rootEl.querySelectorAll('h2, h3'));
  hs.forEach(h => {
    const s = slugify(h.textContent);
    const n = (seen[s] || 0) + 1; seen[s] = n;
    h.id = n > 1 ? s + '-' + n : s;
  });
  if (hs.length < 3) return null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const links = hs.map(h =>
    `<a href="#${h.id}" data-target="${h.id}" class="toc-link${h.tagName === 'H3' ? ' lvl3' : ''}">${esc(h.textContent)}</a>`).join('');
  const rail = document.createElement('nav');
  rail.className = 'doc-outline';
  rail.setAttribute('aria-label', 'On this page');
  rail.innerHTML = `<div class="microlabel text-mut mb-2 px-2.5">On this page</div>${links}`;
  wrapEl.appendChild(rail);
  wrapEl.classList.add('has-outline');
  const det = document.createElement('details');
  det.className = 'doc-toc card !rounded-lg px-4 py-2.5 mb-5';
  det.innerHTML = `<summary class="cursor-pointer microlabel text-mut select-none">Contents</summary>
    <div class="mt-2 pb-1">${links}</div>`;
  rootEl.parentNode.insertBefore(det, rootEl);
  wrapEl.querySelectorAll('.toc-link').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();   // raw fragment writes would bounce off the router
    const el = document.getElementById(a.dataset.target);
    if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    det.open = false;
  }));
  const visible = new Set();
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => en.isIntersecting ? visible.add(en.target.id) : visible.delete(en.target.id));
    const act = hs.find(h => visible.has(h.id));
    if (!act) return;
    rail.querySelectorAll('.toc-link').forEach(a =>
      a.classList.toggle('active', a.dataset.target === act.id));
  }, { root: scrollRoot, rootMargin: '0px 0px -55% 0px' });
  hs.forEach(h => io.observe(h));
  return io;
}

async function viewNotes(app, encodedPath) {
  const epoch = routeEpoch;
  const current = encodedPath ? decodeURIComponent(encodedPath) : null;

  if (!current) {
    /* landing: the curriculum-ordered notebooks index */
    app.innerHTML = spinner('Loading notebook index…');
    let mods;
    try { mods = await getNotebooks(); }
    catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
    if (epoch !== routeEpoch) return;
    app.innerHTML = `
    <div class="max-w-3xl mx-auto p-8">
      <h1 class="page-title mb-1">Notebooks</h1>
      <div class="microlabel text-mut mb-6">curriculum order · checklist ticks in notes save locally in this browser, never to the repo</div>
      ${mods.map(m => `
        <div class="card p-4 mb-4">
          <div class="flex items-baseline gap-2.5 mb-1.5">
            <span class="microlabel text-mut">${esc(m.track)}</span>
            <span class="font-semibold text-zinc-100">${esc(m.folder_title)}</span>
            ${m.notes_path ? `<a class="btn btn-text text-mut text-xs ml-auto shrink-0"
               href="#/notes/${encodeURIComponent(m.notes_path)}">notes</a>` : ''}
          </div>
          ${m.notebooks.map(nb => `
            <a href="#/nb/${encodeURIComponent(nb.path)}" class="block px-2.5 py-2 -mx-1 rounded-lg hover:bg-panel2">
              <div class="flex items-baseline gap-2 flex-wrap">
                <span class="font-medium text-zinc-100">${esc(nb.title)}</span>
                <span class="font-mono text-[11px] text-mut">${esc(nb.file)}</span>
              </div>
              ${nb.blurb ? `<div class="text-[13px] text-mut mt-0.5 truncate">${esc(nb.blurb)}</div>` : ''}
            </a>`).join('')}
        </div>`).join('')}
    </div>`;
    return;
  }

  app.innerHTML = spinner('Loading file…');
  let doc, tree;
  try {
    [doc, tree] = await Promise.all([
      api('/api/md?path=' + encodeURIComponent(current)),
      getTree().catch(() => []),   // breadcrumb degrades, the document still renders
    ]);
  } catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
  if (epoch !== routeEpoch) return;

  const nav = docNav(tree, current);
  const title = (nav.entry && nav.entry.title) || current.split('/').pop();
  /* .ipynb gets only the notebook button - the whole-file Playground run is
     a .py-only concept */
  const extras = current.endsWith('.ipynb')
    ? `<a href="#/nb/${encodeURIComponent(current)}" class="btn btn-text text-accent">Open as notebook</a>`
    : current.endsWith('.py')
    ? `<a href="#/nb/${encodeURIComponent(current)}" class="btn btn-text text-accent">Open as notebook</a>
       <a href="#/lab/${encodeURIComponent(current)}" class="btn btn-text text-mut">Playground</a>` : '';
  app.innerHTML = `
  <div id="doc-wrap" class="doc-wrap">
    <div class="max-w-[72ch] mx-auto px-6 py-8">
      ${crumbRow(nav, current, title, extras)}
      <div class="md" id="md-root">${md(doc.content)}</div>
      ${docFooter(nav)}
    </div>
  </div>`;
  fixMdLinks($('#md-root'), current);
  const outlineIO = buildOutline($('#md-root'), $('#doc-wrap'), app);
  /* checklists: real checkboxes, state in localStorage per file (UI-only).
     Keys hash the item's text (not its index) so edits to the doc don't
     silently shift every saved tick onto the wrong line. */
  const key = 'mlprep.checks.' + current;
  const saved = store.get(key, {});
  const seen = {};
  $$('#md-root input[type=checkbox]').forEach(cb => {
    cb.disabled = false;
    const li = cb.closest('li');
    const txt = ((li ? li.textContent : (cb.parentElement && cb.parentElement.textContent)) || '').trim();
    const h = hashText(txt);
    const n = seen[h] || 0; seen[h] = n + 1;
    const id = n ? h + ':' + n : h;   // disambiguate duplicate item texts
    if (id in saved) cb.checked = !!saved[id];
    cb.addEventListener('change', () => {
      const cur = store.get(key, {});
      cur[id] = cb.checked;
      store.set(key, cur);
    });
  });
  const keyH = docNavKeys(nav);
  document.addEventListener('keydown', keyH);
  cleanup = () => {
    document.removeEventListener('keydown', keyH);
    if (outlineIO) outlineIO.disconnect();
  };
}

/* Playground: edit a curriculum script and run the WHOLE edited file. The

async function viewLab(app, path) {
  const epoch = routeEpoch;

  catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }

  /* draft autosave (localStorage, per path, debounced) */

  if (startVal !== doc.content) {

    $('#lab-result').innerHTML = r.ok
      ? `<div class="p-4 rise">
           <div class="p-3 rounded-xl soft-good flex items-center gap-3 text-good font-semibold text-sm">✓ Exit 0 - every check in the file passed
             <span class="text-mut font-normal tnum">(${r.elapsed_ms} ms)</span>${closeBtn}</div>
           ${r.output ? `<pre class="mt-3 text-xs bg-panel border border-line rounded-lg p-3 overflow-x-auto whitespace-pre-wrap">${esc(r.output)}</pre>` : ''}
         </div>`
      : `<div class="p-4 rise">
           <div class="p-3 rounded-xl soft-bad flex items-center gap-3 text-bad font-semibold text-sm">✕ Failed
             <span class="text-mut font-normal tnum">(${r.elapsed_ms} ms)</span>${closeBtn}</div>
           <pre class="mt-3 text-xs bg-panel border border-line rounded-lg p-3 overflow-x-auto whitespace-pre-wrap text-bad">${esc(r.error)}</pre>
           ${r.output ? `<pre class="mt-2 text-xs bg-panel border border-line rounded-lg p-3 overflow-x-auto whitespace-pre-wrap">${esc(r.output)}</pre>` : ''}
         </div>`;
    $('#lab-close').onclick = () => { $('#lab-result').innerHTML = ''; (cm || $('#lab-ta')).focus(); };
  }
  $('#lab-run').onclick = run;
  $('#lab-reset').onclick = () => {
    if (!confirm('Discard your edits and reload the original file?')) return;
    setCode(doc.content);
    try { localStorage.removeItem(draftKey); } catch (e) {}
    const bar = $('#lab-draft-bar'); if (bar) bar.style.display = 'none';
  };
}

/* --------------------------------------------------------- view: notebook */
/* Jupyter-style cells over a curriculum file: .ipynb files use their own
   cells verbatim; .py scripts are split at their section banners. Each cell
   runs in one persistent kernel process, so state (imports, defs, arrays)
   carries from cell to cell. Cell edits are session-only; the repo file is
   never written. */
const stopKernel = sid => {
  if (!sid) return;
  const body = JSON.stringify({ session: sid });
  if (navigator.sendBeacon) {
    try {
      navigator.sendBeacon('/api/nb/stop', new Blob([body], { type: 'application/json' }));
      return;
    } catch (e) {}
  }
  try {
    fetch('/api/nb/stop', { method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' }, body });
  } catch (e) {}
};

/* .py prose cell source -> readable text: comment markers and banner rules
   are stripped; a module docstring keeps its text as-is (md() renders both).
   .ipynb prose cells are already markdown and skip this entirely. */
function proseText(src) {
  const lines = src.replace(/\s+$/, '').split('\n');
  const head = [];
  let i = 0;
  while (i < lines.length && /^\s*(#|$)/.test(lines[i])) {
    if (!/^\s*#\s*[-=]{3,}/.test(lines[i])) head.push(lines[i].replace(/^\s*#\s?/, ''));
    i++;
  }
  let tail = lines.slice(i).join('\n').trim();
  const m = tail.match(/^[A-Za-z]{0,2}("""|''')([\s\S]*?)\1$/);
  if (m) tail = m[2].trim();                    // docstring text, verbatim
  else if (tail) tail = tail.split('\n')        // stray comments after it
    .filter(l => !/^\s*#\s*[-=]{3,}/.test(l))
    .map(l => l.replace(/^\s*#\s?/, '')).join('\n');
  return [head.join('\n').trim(), tail].filter(Boolean).join('\n\n');
}

async function viewNb(app, path) {
  const epoch = routeEpoch;
  app.innerHTML = spinner('Loading notebook…');
  let doc, tree, session = null;
  try {
    [doc, tree] = await Promise.all([
      api('/api/nb/cells?path=' + encodeURIComponent(path)),
      getTree().catch(() => []),   // breadcrumb degrades, the notebook still opens
    ]);
    if (epoch !== routeEpoch) return;
    session = (await api('/api/nb/start', { path })).session;
  } catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
  if (epoch !== routeEpoch) { stopKernel(session); return; }
  const nav = docNav(tree, path);

  const S = { session, cells: [], counter: 0, busy: false, restarting: false, stopped: false };
  /* "ipynb": prose cells are real markdown, rendered as-is; "py": prose cells
     are comment/docstring blocks that go through proseText() first */
  const fmt = doc.format || 'py';

  app.innerHTML = `
  <div class="max-w-4xl mx-auto p-6">
    ${crumbRow(nav, path, doc.title || (nav.entry && nav.entry.title) || path,
      `<a class="btn btn-text text-mut" href="#/notes/${encodeURIComponent(path)}">Read-only view</a>`)}
    <div class="flex items-center gap-3 flex-wrap">
      <span class="flex items-center gap-1.5 text-xs text-mut">
        <span id="nb-dot" class="inline-block w-2 h-2 rounded-full bg-good"></span>
        <span id="nb-status" class="tnum">idle</span>
      </span>
      <div class="ml-auto flex items-center gap-2">
        <button id="nb-runall" class="btn btn-secondary">Run all</button>
        <button id="nb-restart" class="btn btn-secondary">Restart kernel</button>
        ${doc.notes ? `<a class="btn btn-text text-mut" href="#/notes/${encodeURIComponent(doc.notes)}">notes</a>` : ''}
      </div>
    </div>
    <div class="microlabel text-mut mt-1.5 mb-5">edits are session-only, the file on disk is untouched</div>
    <div id="nb-cells"></div>
    <div class="mt-1">
      <button id="nb-add" class="btn btn-text text-mut text-sm" title="Append an empty scratch cell (this session only)">+ add cell</button>
    </div>
    ${docFooter(nav)}
  </div>`;

  /* kernel status: dot + label, elapsed ticking while a cell runs */
  let statT = null;
  const setStatus = st => {
    const dot = $('#nb-dot'), lab = $('#nb-status');
    if (!dot || !lab) return;
    clearInterval(statT); statT = null;
    if (st === 'running' || st === 'restarting') {
      dot.className = 'inline-block w-2 h-2 rounded-full bg-warn animate-pulse';
      if (st === 'restarting') { lab.textContent = 'restarting…'; return; }
      const t0 = Date.now();
      const tick = () => {
        const l = $('#nb-status');
        if (l) l.textContent = 'running ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s';
      };
      statT = setInterval(tick, 100); tick();
    } else if (st === 'dead') {
      dot.className = 'inline-block w-2 h-2 rounded-full bg-bad';
      lab.textContent = 'dead';
    } else {
      dot.className = 'inline-block w-2 h-2 rounded-full bg-good';
      lab.textContent = 'idle';
    }
  };

  const cellsEl = $('#nb-cells');
  const code = c => c.cm ? c.cm.getValue() : c.ta.value;

  function makeCell(source, kind) {
    const i = S.cells.length;
    if (kind === 'prose') {
      /* reading prose, not an editor: no card chrome, no gutter number, not
         runnable; "view source" keeps the raw text one click away */
      const el = document.createElement('div');
      el.className = 'nb-prose group mb-4 pl-14 pr-2';
      el.innerHTML = `
        <div class="md text-[.92rem]">${md(fmt === 'ipynb' ? source : proseText(source))}</div>
        <button class="nb-src-btn btn btn-text text-mut text-xs opacity-0 group-hover:opacity-100 focus-visible:opacity-100">view source</button>
        <pre class="nb-src hidden mt-1 p-3 rounded-lg text-xs font-mono whitespace-pre overflow-x-auto bg-[var(--pre-bg)] text-[var(--pre-text)] border border-[var(--code-border)]"></pre>`;
      el.querySelector('.nb-src').textContent = source.replace(/\n+$/, '');
      cellsEl.appendChild(el);
      const btn = el.querySelector('.nb-src-btn'), pre = el.querySelector('.nb-src');
      btn.onclick = () => {
        const hidden = pre.classList.toggle('hidden');
        btn.textContent = hidden ? 'view source' : 'hide source';
      };
      const cell = { el, kind: 'prose', cm: null, ta: null, order: null };
      S.cells.push(cell);
      return cell;
    }
    const el = document.createElement('div');
    el.className = 'card mb-3 overflow-hidden';
    el.innerHTML = `
      <div class="flex items-stretch">
        <div class="nb-gut w-14 shrink-0 pt-2.5 pr-2 text-right text-[11px] font-mono tnum text-mut select-none">[&nbsp;]</div>
        <div class="nb-ed flex-1 min-w-0 py-1.5 pr-2"></div>
      </div>
      <div class="nb-out hidden border-t border-line">
        <pre class="nb-stdout hidden px-4 py-3 text-xs font-mono whitespace-pre-wrap overflow-x-auto text-[var(--pre-text)]"></pre>
        <pre class="nb-stderr hidden mx-3 my-2.5 p-3 rounded-lg soft-bad text-bad text-xs font-mono whitespace-pre-wrap overflow-x-auto"></pre>
        <div class="nb-ms microlabel text-mut px-4 pb-2 pt-0.5 tnum"></div>
      </div>`;
    cellsEl.appendChild(el);
    const cell = {
      el, kind: 'code',
      gut: el.querySelector('.nb-gut'), out: el.querySelector('.nb-out'),
      so: el.querySelector('.nb-stdout'), se: el.querySelector('.nb-stderr'),
      ms: el.querySelector('.nb-ms'), cm: null, ta: null, order: null,
    };
    const host = el.querySelector('.nb-ed');
    /* trailing blank separator lines belong to the file, not the cell UI */
    const display = source.replace(/\n+$/, '');
    if (window.CodeMirror) {
      cell.cm = CodeMirror(host, {
        value: display, mode: 'python', lineNumbers: false,
        theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
        viewportMargin: Infinity,
        indentUnit: 4, tabSize: 4, indentWithTabs: false,
        extraKeys: {
          'Shift-Enter': () => { runCell(i, true); },
          'Cmd-Enter': () => { runCell(i, false); },
          'Ctrl-Enter': () => { runCell(i, false); },
          Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    '),
        },
      });
      cell.cm.setSize(null, 'auto');
    } else {
      const ta = document.createElement('textarea');
      ta.spellcheck = false;
      ta.value = display;
      ta.rows = Math.max(3, display.split('\n').length + 1);
      ta.className = 'w-full bg-panel font-mono text-sm p-3 outline-none resize-y';
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.shiftKey || e.metaKey || e.ctrlKey)) {
          e.preventDefault(); runCell(i, e.shiftKey);
        }
      });
      host.appendChild(ta);
      cell.ta = ta;
    }
    S.cells.push(cell);
    return cell;
  }

  function setGutter(cell, txt, spin) {
    cell.gut.textContent = txt;
    cell.gut.classList.toggle('animate-pulse', !!spin);
  }
  function showOut(cell, r) {
    cell.out.classList.remove('hidden', 'opacity-50');
    cell.so.classList.toggle('hidden', !r.stdout);
    cell.so.textContent = r.stdout || '';
    const bad = [r.stderr, r.error].filter(Boolean).join('\n');
    cell.se.classList.toggle('hidden', !bad);
    cell.se.textContent = bad;
    cell.ms.textContent = (r.elapsed_ms != null) ? r.elapsed_ms + ' ms' : '';
  }
  /* quiet hint in the cell's output area (kernel busy / dead / expired) */
  function hint(cell, msg) {
    cell.out.classList.remove('hidden', 'opacity-50');
    cell.se.classList.remove('hidden');
    cell.se.textContent = msg;
    cell.ms.textContent = '';
  }
  function markAllUnrun() {
    S.counter = 0;
    S.cells.forEach(c => {
      if (c.kind === 'prose') return;
      c.order = null;
      setGutter(c, '[ ]', false);
      /* outputs stay visible, but faded until their cell is re-run */
      if (!c.out.classList.contains('hidden')) c.out.classList.add('opacity-50');
    });
  }

  async function restartKernel() {
    if (S.restarting) return;
    S.restarting = true;
    setStatus('restarting');
    try { await api('/api/nb/restart', { session: S.session }); }
    catch (e) {
      /* session reaped or evicted: fall back to a brand-new kernel */
      try { S.session = (await api('/api/nb/start', { path })).session; }
      catch (e2) {
        if (epoch === routeEpoch) setStatus('dead');
        S.restarting = false;
        return;
      }
    }
    S.restarting = false;
    if (epoch !== routeEpoch) return;
    markAllUnrun();
    setStatus('idle');
  }

  /* returns true when the cell ran cleanly (run-all stops on anything else) */
  async function runCell(i, advance) {
    const cell = S.cells[i];
    if (!cell) return false;
    if (cell.kind === 'prose') return true;   // prose never runs
    if (S.busy) { hint(cell, 'kernel busy: a cell is already running'); return false; }
    S.busy = true;
    setStatus('running');
    setGutter(cell, '[*]', true);
    let r = null, threw = null;
    try { r = await api('/api/nb/run', { session: S.session, code: code(cell) }); }
    catch (e) { threw = e; }
    S.busy = false;
    if (epoch !== routeEpoch) return false;
    setGutter(cell, cell.order ? '[' + cell.order + ']' : '[ ]', false);
    if (threw) {
      const m = String(threw.message || threw);
      if (/unknown session/i.test(m)) {
        /* reaped after 30 min idle, or LRU-evicted: start fresh, then rerun */
        try { S.session = (await api('/api/nb/start', { path })).session; }
        catch (e2) { if (epoch === routeEpoch) { hint(cell, m); setStatus('dead'); } return false; }
        if (epoch !== routeEpoch) return false;
        markAllUnrun();
        hint(cell, 'kernel session expired, a fresh kernel was started: run cells again from the top');
      } else if (/kernel busy/i.test(m)) {
        hint(cell, 'kernel busy: wait for the running cell to finish');
      } else {
        hint(cell, m);
      }
      setStatus('idle');
      return false;
    }
    if (r.dead) {
      /* timed out or crashed: the server killed the process, respawn it so
         the next run works, then surface the error where it happened */
      await restartKernel();
      if (epoch !== routeEpoch) return false;
      hint(cell, r.error || 'kernel died: run cells again');
      return false;
    }
    S.counter += 1;
    cell.order = S.counter;
    setGutter(cell, '[' + S.counter + ']', false);
    showOut(cell, r);
    setStatus('idle');
    if (advance && r.ok) {
      /* focus moves to the next CODE cell (prose is skipped); none created */
      let j = i + 1;
      while (j < S.cells.length && S.cells[j].kind === 'prose') j++;
      const nxt = S.cells[j];
      if (nxt) { (nxt.cm || nxt.ta).focus(); nxt.el.scrollIntoView({ block: 'nearest' }); }
    }
    return !!r.ok;
  }

  async function runAll() {
    if (S.busy || S.restarting) return;
    for (let i = 0; i < S.cells.length; i++) {
      if (S.cells[i].kind === 'prose') continue;
      const ok = await runCell(i, false);
      if (epoch !== routeEpoch) return;
      if (!ok) { S.cells[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    }
  }

  (doc.cells.length ? doc.cells : [{ source: '', kind: 'code' }])
    .forEach(c => makeCell(c.source, c.kind || 'code'));
  $('#nb-runall').onclick = runAll;
  $('#nb-restart').onclick = restartKernel;
  $('#nb-add').onclick = () => { const c = makeCell('', 'code'); (c.cm || c.ta).focus(); };

  /* the theme toggle only re-themes window._cm; a notebook has many editors,
     so watch the html class and re-theme them all (window._cm stays null) */
  const themeObs = new MutationObserver(() => {
    const th = document.documentElement.classList.contains('dark') ? 'material-darker' : 'default';
    S.cells.forEach(c => c.cm && c.cm.setOption('theme', th));
  });
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  const navKeyH = docNavKeys(nav);
  document.addEventListener('keydown', navKeyH);
  const stopOnce = () => { if (!S.stopped) { S.stopped = true; stopKernel(S.session); } };
  window.addEventListener('pagehide', stopOnce);
  cleanup = () => {
    clearInterval(statT);
    themeObs.disconnect();
    document.removeEventListener('keydown', navKeyH);
    window.removeEventListener('pagehide', stopOnce);
    stopOnce();
  };
}

/* ------------------------------------------------------------ view: cards */
async function viewCards(app, slug) {
  const epoch = routeEpoch;
  app.innerHTML = spinner('Loading flashcards…');
  let cards;
  try { cards = await getCards(); } catch (e) { if (epoch === routeEpoch) app.innerHTML = errBox(e); return; }
  if (epoch !== routeEpoch) return;
  const sections = [...new Map(cards.map(c => [c.slug, c.section])).entries()];

  if (!slug) {
    app.innerHTML = `
    <div class="max-w-3xl mx-auto p-8">
      <h1 class="page-title mb-1.5">Flashcards</h1>
      <p class="text-sm text-mut mb-6">${cards.length} cards. Answer <b>out loud</b> before flipping  - 
        a hesitation counts as a miss. Missed cards are listed at the end of the deck so you can re-run them.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${sections.map(([s, title]) => {
          const n = cards.filter(c => c.slug === s).length;
          return `<a href="#/cards/${esc(s)}" class="card block p-4 hover:border-accent">
            <div class="font-semibold text-zinc-100">${esc(title)}</div>
            <div class="text-[13px] text-mut mt-1 tnum">${n} cards</div></a>`;
        }).join('')}
      </div>
    </div>`;
    return;
  }

  const deck = cards.filter(c => c.slug === slug);
  if (!deck.length) { app.innerHTML = errBox(new Error('unknown section: ' + slug)); return; }
  const state = { i: 0, flipped: false, got: 0, missed: [] };

  const render = () => {
    if (epoch !== routeEpoch) return;   // guard against renders after navigation
    if (state.i >= deck.length) {
      app.innerHTML = `
      <div class="max-w-xl mx-auto p-10 text-center rise">
        <h1 class="page-title mb-2">Deck complete</h1>
        <p class="text-sm text-mut mb-5">${esc(deck[0].section)}</p>
        <div class="text-4xl font-bold tracking-tight tnum mb-1 ${state.missed.length ? 'text-warn' : 'text-good'}">
          ${state.got}/${deck.length}</div>
        <p class="text-sm text-mut mb-6">got it - ${state.missed.length} missed
          ${state.missed.length ? '(listed below - restart the deck to re-run them)' : ''}</p>
        ${state.missed.length ? `<div class="card text-left text-sm p-4 mb-6">
          <div class="microlabel text-mut mb-2">Missed</div>
          <ul class="list-disc ml-5 space-y-1">${state.missed.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>` : ''}
        <div class="flex gap-3 justify-center">
          <button id="c-restart" class="btn btn-secondary">Restart deck</button>
          <a href="#/cards" class="btn btn-primary">All sections</a>
        </div>
      </div>`;
      $('#c-restart').onclick = () => { state.i = 0; state.flipped = false; state.got = 0; state.missed = []; render(); };
      return;
    }
    const c = deck[state.i];
    app.innerHTML = `
    <div class="max-w-2xl mx-auto p-8 relative">
      <div class="flex items-baseline justify-between mb-4">
        <a href="#/cards" class="text-xs text-mut hover:text-accent">← sections</a>
        <div class="text-[13px] text-mut">${esc(c.section)} · <b class="text-zinc-200 tnum">${state.i + 1}/${deck.length}</b></div>
      </div>
      <div id="card" class="card rise cursor-pointer select-none ${state.flipped ? '!border-accent/50' : ''}
           p-9 min-h-[17rem] flex flex-col justify-center" title="click or Space to flip">
        <div class="microlabel ${state.flipped ? 'text-accent' : 'text-mut'} mb-3">
          ${state.flipped ? 'Answer' : 'Question'}</div>
        ${state.flipped
          ? `<div class="md text-[.95rem]">${md(c.answer)}</div>`
          : `<div class="text-lg font-medium leading-relaxed text-zinc-100">${esc(c.question)}</div>`}
      </div>
      <div class="mt-4 flex items-center gap-3 ${state.flipped ? '' : 'invisible'}">
        <button id="c-miss" class="btn soft-bad text-bad font-semibold">✕ Missed <span class="text-xs opacity-70 font-normal">1</span></button>
        <button id="c-got" class="btn soft-good text-good font-semibold">✓ Got it <span class="text-xs opacity-70 font-normal">2</span></button>
        <span class="ml-auto text-[11px] text-mut italic">grade before you flip back - recognition is not recall</span>
      </div>
    </div>`;
    fixMdLinks($('#card'), 'practice/flashcards.md');
    $('#card').onclick = () => { state.flipped = !state.flipped; render(); };
    if (state.flipped) {
      $('#c-miss').onclick = e => { e.stopPropagation(); grade('fail'); };
      $('#c-got').onclick = e => { e.stopPropagation(); grade('pass'); };
    }
  };
  const grade = (result) => {
    const c = deck[state.i];
    if (result === 'pass') state.got++; else state.missed.push(c.question);
    state.i++; state.flipped = false; render();
  };
  const keyHandler = e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'A') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      if (state.i < deck.length) { state.flipped = !state.flipped; render(); }
    }
    else if (state.flipped && e.key === '1') grade('fail');
    else if (state.flipped && e.key === '2') grade('pass');
  };
  document.addEventListener('keydown', keyHandler);
  cleanup = () => document.removeEventListener('keydown', keyHandler);
  render();
}
