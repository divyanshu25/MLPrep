<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLPrep — Study App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
if (window.tailwind) tailwind.config = { theme: { extend: {
  colors: { base:'var(--base)', panel:'var(--panel)', panel2:'var(--panel2)', line:'var(--line)',
            accent:'#ffa116', good:'#2cbb5d', warn:'var(--warn)', bad:'#ef4743',
            mut:'var(--mut)' },
  fontFamily: { mono:['ui-monospace','SFMono-Regular','Menlo','Consolas','monospace'] }
}}};
// apply saved theme before first paint to avoid a flash (default: light)
document.documentElement.classList.toggle('dark', localStorage.getItem('mlprep-theme') === 'dark');
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>.katex-display{overflow-x:auto;overflow-y:hidden;padding:0.25rem 0}</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<style>
  /* Theme palettes: light is the default; html.dark switches to the LC-dark look. */
  :root {
    --base:#f7f8fa; --panel:#ffffff; --panel2:#f1f3f5; --line:#e2e5e9;
    --warn:#c98f0a; --mut:#6b7280; --text:#24292f; --text-strong:#111318;
    --code-bg:#f3f4f6; --code-border:#e2e5e9; --code-text:#b45309;
    --pre-bg:#f6f8fa; --pre-text:#24292f; --th-bg:#f1f3f5;
    --quote:#57606a; --details-bg:#fafbfc; --scroll:#d1d5db; --dot-todo:#c8cdd4;
  }
  html.dark {
    --base:#1a1a1a; --panel:#222222; --panel2:#2a2a2a; --line:#383838;
    --warn:#ffc01e; --mut:#9ca3af; --text:#e4e4e7; --text-strong:#fafafa;
    --code-bg:#2d2d2d; --code-border:#3a3a3a; --code-text:#fbbf24;
    --pre-bg:#161616; --pre-text:#d4d4d8; --th-bg:#262626;
    --quote:#a1a1aa; --details-bg:#232323; --scroll:#3f3f46; --dot-todo:#52525b;
  }
  /* Only #app and inner panes scroll: the page shell itself is locked so nothing
     (hidden helpers, momentum chaining) can scroll past the end of the content. */
  html, body { height:100%; overflow:hidden; }
  html { background:var(--base); }
  body { background:var(--base); color:var(--text); }
  .overflow-y-auto { overscroll-behavior-y: contain; }
  /* legacy fixed-shade classes → semantic theme colors */
  .text-zinc-100, .text-zinc-200 { color:var(--text-strong) !important; }
  .text-zinc-300 { color:var(--text) !important; }
  .text-zinc-400 { color:var(--mut) !important; }
  .bg-zinc-600 { background-color:var(--dot-todo) !important; }
  .CodeMirror { height:100%; font-size:14px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .cm-s-material-darker.CodeMirror { background:#1e1e1e; }
  .cm-s-default.CodeMirror { background:#fff; border:1px solid var(--line); }
  /* markdown body */
  .md { line-height:1.65; font-size:.925rem; }
  .md h1 { font-size:1.5rem; font-weight:700; margin:1.2rem 0 .8rem; color:var(--text-strong); }
  .md h2 { font-size:1.2rem; font-weight:700; margin:1.6rem 0 .6rem; color:var(--text-strong);
           border-bottom:1px solid var(--line); padding-bottom:.3rem; }
  .md h3 { font-size:1.05rem; font-weight:600; margin:1.2rem 0 .5rem; color:var(--text-strong); }
  .md p { margin:.55rem 0; }
  .md ul, .md ol { margin:.55rem 0 .55rem 1.4rem; }
  .md ul { list-style:disc; } .md ol { list-style:decimal; }
  .md li { margin:.22rem 0; }
  .md a { color:#ffa116; text-decoration:underline; text-underline-offset:2px; }
  .md code { background:var(--code-bg); border:1px solid var(--code-border); border-radius:4px;
             padding:.08rem .3rem; font-size:.85em; font-family:ui-monospace,Menlo,monospace; color:var(--code-text); }
  .md pre { background:var(--pre-bg); border:1px solid var(--code-border); border-radius:8px;
            padding:.8rem 1rem; overflow-x:auto; margin:.7rem 0; }
  .md pre code { background:none; border:none; padding:0; color:var(--pre-text); font-size:.83rem; }
  .md table { border-collapse:collapse; margin:.8rem 0; font-size:.86rem; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--code-border); padding:.4rem .7rem; text-align:left; vertical-align:top; }
  .md th { background:var(--th-bg); color:var(--text-strong); }
  .md blockquote { border-left:3px solid #ffa116; padding-left:.9rem; color:var(--quote); margin:.7rem 0; }
  .md details { background:var(--details-bg); border:1px solid var(--code-border); border-radius:8px;
                padding:.5rem .9rem; margin:.6rem 0; }
  .md summary { cursor:pointer; color:#ffa116; font-weight:600; }
  .md hr { border-color:var(--line); margin:1.4rem 0; }
  .md input[type=checkbox] { accent-color:#ffa116; width:.95rem; height:.95rem; margin-right:.35rem; }
  .md img { max-width:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body class="bg-base antialiased">

<div id="offline-banner" style="display:none;background:#7c2d12;color:#fed7aa;padding:8px 16px;
     font:13px system-ui;border-bottom:1px solid #9a3412;"></div>

<nav class="h-14 flex items-center gap-6 px-5 border-b border-line bg-panel sticky top-0 z-20">
  <a href="#/problems" class="flex items-center gap-2 font-bold text-lg tracking-tight">
    <span class="text-accent">▲</span><span>MLPrep</span>
  </a>
  <div class="flex gap-1 text-sm" id="nav-tabs">
    <a href="#/problems" data-tab="problems" class="px-3 py-1.5 rounded-md hover:bg-panel2">Problems</a>
    <a href="#/notes"    data-tab="notes"    class="px-3 py-1.5 rounded-md hover:bg-panel2">Notes</a>
    <a href="#/cards"    data-tab="cards"    class="px-3 py-1.5 rounded-md hover:bg-panel2">Cards</a>
    <a href="#/review"   data-tab="review"   class="px-3 py-1.5 rounded-md hover:bg-panel2">Review</a>
  </div>
  <div class="ml-auto flex items-center gap-3 text-xs text-mut" id="nav-progress"></div>
  <button id="theme-toggle" class="px-2.5 py-1.5 rounded-md border border-line hover:bg-panel2 text-sm"
          title="Toggle light / dark theme"></button>
</nav>

<main id="app" class="h-[calc(100vh-3.5rem)] overflow-y-auto"></main>

<script>
'use strict';
/* ------------------------------------------------------------------ core */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Markdown + LaTeX. marked mangles math ($W_1$ -> italics, \\ eaten), so math
   spans are stashed behind placeholder tokens before parsing, typeset with
   KaTeX, and spliced back into the rendered HTML afterwards. Fenced code
   blocks are exempt so `$` in shell/code snippets is never treated as math. */
const md = t => {
  if (!window.marked) return '<pre>'+esc(t)+'</pre>';
  const stash = [];
  const hold = (tex, display) => {
    let html = null;
    if (window.katex) {
      try { html = katex.renderToString(tex, {displayMode: display, throwOnError: false}); }
      catch (e) { html = null; }
    }
    if (html === null) html = '<code>'+esc(display ? '$$'+tex+'$$' : '$'+tex+'$')+'</code>';
    stash.push(html);
    const tok = '@@MATH'+(stash.length-1)+'@@';
    return display ? '\n\n'+tok+'\n\n' : tok;
  };
  const guarded = t.split(/(```[\s\S]*?```)/g).map(seg => {
    if (seg.startsWith('```')) return seg;
    return seg
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => hold(tex.trim(), true))
      .replace(/(?<!\\)\$(?!\s)((?:\\.|[^$\n])+?)\$(?!\d)/g, (_, tex) => hold(tex, false));
  }).join('');
  return marked.parse(guarded, {gfm:true}).replace(/@@MATH(\d+)@@/g, (_, i) => stash[+i]);
};
const DIFF_CLS = {easy:'text-good', medium:'text-warn', hard:'text-bad'};
const STATUS_DOT = {solved:'bg-good', attempted:'bg-warn', todo:'bg-zinc-600'};
const STATUS_TITLE = {solved:'Solved (last logged: pass)', attempted:'Attempted (last logged: fail)', todo:'Not attempted'};

async function api(path, body) {
  const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                       body: JSON.stringify(body)} : undefined;
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || res.status + ' ' + res.statusText);
  return data;
}
const errBox = e => `<div class="m-6 p-4 rounded-lg border border-bad/50 bg-bad/10 text-bad text-sm">
  <b>Error:</b> ${esc(e.message || e)}</div>`;
const spinner = msg => `<div class="p-10 text-center text-mut text-sm animate-pulse">${esc(msg || 'Loading…')}</div>`;

let problemsCache = null;
async function getProblems(force) {
  if (force || !problemsCache) problemsCache = await api('/api/problems');
  return problemsCache;
}
let cardsCache = null;
async function getCards() {
  if (!cardsCache) cardsCache = await api('/api/flashcards');
  return cardsCache;
}

/* seeded daily shuffle: same order all day, new order tomorrow */
function dailyShuffle(arr) {
  let h = 2166136261;
  for (const c of new Date().toISOString().slice(0, 10)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rand = () => { h = Math.imul(h ^ h >>> 15, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
                       return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function fmtClock(sec) { return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

/* ---------------------------------------------------------------- router */
let cleanup = null;
window.addEventListener('hashchange', route);
function syncTheme() {
  const dark = document.documentElement.classList.contains('dark');
  const btn = $('#theme-toggle');
  if (btn) btn.textContent = dark ? '☀️' : '🌙';
  if (window._cm) window._cm.setOption('theme', dark ? 'material-darker' : 'default');
}
window.addEventListener('load', () => {
  $('#theme-toggle').onclick = () => {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('mlprep-theme', dark ? 'dark' : 'light');
    syncTheme();
  };
  syncTheme();
  const missing = [];
  if (!window.tailwind) missing.push('Tailwind');
  if (!window.marked) missing.push('marked (markdown)');
  if (!window.CodeMirror) missing.push('CodeMirror (editor)');
  if (!window.katex) missing.push('KaTeX (math will show as raw LaTeX)');
  if (missing.length) {
    const b = $('#offline-banner'); b.style.display = 'block';
    b.textContent = 'Offline? These CDN assets failed to load: ' + missing.join(', ') +
      '. The app still works, but with degraded styling / a plain-textarea editor / raw markdown.';
  }
  route();
});

function route() {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  const h = location.hash || '#/problems';
  const app = $('#app');
  app.scrollTop = 0;
  const tab = h.startsWith('#/problem') ? 'problems'
            : h.startsWith('#/notes') ? 'notes'
            : h.startsWith('#/cards') ? 'cards'
            : h.startsWith('#/review') ? 'review' : 'problems';
  $$('#nav-tabs a').forEach(a => a.className =
    'px-3 py-1.5 rounded-md hover:bg-panel2 ' +
    (a.dataset.tab === tab ? 'bg-panel2 text-accent font-semibold' : 'text-zinc-300'));
  updateNavProgress();
  if (h.startsWith('#/problem/')) viewProblem(app, decodeURIComponent(h.slice('#/problem/'.length)));
  else if (h.startsWith('#/notes')) viewNotes(app, h.slice('#/notes'.length).replace(/^\//, ''));
  else if (h.startsWith('#/cards')) viewCards(app, h.slice('#/cards'.length).replace(/^\//, ''));
  else if (h.startsWith('#/review')) viewReview(app);
  else viewProblems(app);
}

async function updateNavProgress() {
  try {
    const ps = await getProblems();
    const solved = ps.filter(p => p.status === 'solved').length;
    $('#nav-progress').innerHTML = `
      <span>${solved}/${ps.length} solved</span>
      <div class="w-28 h-1.5 bg-panel2 rounded-full overflow-hidden">
        <div class="h-full bg-good" style="width:${ps.length ? 100 * solved / ps.length : 0}%"></div>
      </div>`;
  } catch (e) { /* nav progress is decorative */ }
}

/* ---------------------------------------------------- view: problem list */
const filt = { q: '', folder: 'all', diff: 'all', status: 'all' };

async function viewProblems(app) {
  app.innerHTML = spinner('Loading problems…');
  let ps;
  try { ps = await getProblems(); } catch (e) { app.innerHTML = errBox(e); return; }
  const interleave = !!store.get('mlprep.interleave', false);
  const folders = [...new Map(ps.map(p => [p.folder, p.folder_title])).entries()];

  const chips = folders.map(([f, title]) => {
    const all = ps.filter(p => p.folder === f);
    const s = all.filter(p => p.status === 'solved').length;
    return `<span class="px-2 py-0.5 rounded-full bg-panel2 border border-line text-[11px]
      ${s === all.length ? 'text-good border-good/40' : 'text-mut'}">${esc(title)} ${s}/${all.length}</span>`;
  }).join(' ');
  const solved = ps.filter(p => p.status === 'solved').length;

  app.innerHTML = `
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex items-end justify-between flex-wrap gap-3 mb-1">
      <h1 class="text-xl font-bold">Problems</h1>
      <div class="flex items-center gap-2 flex-wrap">${chips}</div>
    </div>
    <div class="h-2 bg-panel2 rounded-full overflow-hidden mb-5">
      <div class="h-full bg-good transition-all" style="width:${ps.length ? 100 * solved / ps.length : 0}%"></div>
    </div>
    <div class="flex items-center gap-2 flex-wrap mb-4 text-sm">
      <input id="f-q" placeholder="Search title / name…" value="${esc(filt.q)}"
        class="bg-panel border border-line rounded-md px-3 py-1.5 w-56 outline-none focus:border-accent">
      <select id="f-folder" class="bg-panel border border-line rounded-md px-2 py-1.5 ${interleave ? 'hidden' : ''}">
        <option value="all">All patterns</option>
        ${folders.map(([f, t]) => `<option value="${esc(f)}" ${filt.folder === f ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select>
      <select id="f-diff" class="bg-panel border border-line rounded-md px-2 py-1.5">
        <option value="all">All difficulties</option>
        ${['easy', 'medium', 'hard'].map(d => `<option value="${d}" ${filt.diff === d ? 'selected' : ''}>${d[0].toUpperCase() + d.slice(1)}</option>`).join('')}
      </select>
      <select id="f-status" class="bg-panel border border-line rounded-md px-2 py-1.5">
        <option value="all">Any status</option>
        ${['todo', 'attempted', 'solved'].map(s => `<option value="${s}" ${filt.status === s ? 'selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('')}
      </select>
      <label class="ml-auto flex items-center gap-2 cursor-pointer select-none px-3 py-1.5 rounded-md border
        ${interleave ? 'border-accent bg-accent/10 text-accent' : 'border-line bg-panel text-mut'}"
        title="Interleaving hides the pattern labels and shuffles topics (stable per day) — deciding WHICH pattern applies is the interview skill, and labeled lists decide it for you.">
        <input id="f-inter" type="checkbox" class="accent-[#ffa116]" ${interleave ? 'checked' : ''}>
        <span class="font-semibold">Interleave mode</span>
      </label>
    </div>
    <div id="ptable"></div>
  </div>`;

  const renderTable = () => {
    const inter = !!store.get('mlprep.interleave', false);
    let list = ps.filter(p =>
      (filt.q === '' || (p.statement_first_line + ' ' + p.name).toLowerCase().includes(filt.q.toLowerCase())) &&
      (inter || filt.folder === 'all' || p.folder === filt.folder) &&
      (filt.diff === 'all' || p.difficulty === filt.diff) &&
      (filt.status === 'all' || p.status === filt.status));
    list = inter ? dailyShuffle(list) : list;
    $('#ptable').innerHTML = `
    <div class="border border-line rounded-lg overflow-hidden">
    <table class="w-full text-sm">
      <thead><tr class="bg-panel text-mut text-xs uppercase tracking-wider">
        <th class="px-4 py-2.5 text-left w-14">Status</th>
        <th class="px-4 py-2.5 text-left">Title</th>
        ${inter ? '' : '<th class="px-4 py-2.5 text-left w-56">Pattern</th>'}
        <th class="px-4 py-2.5 text-left w-28">Difficulty</th>
        <th class="px-4 py-2.5 text-left w-24">Time box</th>
      </tr></thead>
      <tbody>
      ${list.map((p, i) => `
        <tr class="border-t border-line hover:bg-panel2 cursor-pointer ${i % 2 ? 'bg-panel/40' : ''}"
            onclick="location.hash='#/problem/${esc(p.id)}'">
          <td class="px-4 py-2.5"><span class="inline-block w-2.5 h-2.5 rounded-full ${STATUS_DOT[p.status]}"
              title="${STATUS_TITLE[p.status]}"></span></td>
          <td class="px-4 py-2.5">
            <div class="font-medium text-zinc-100">${esc(p.name)}
              <span class="text-[10px] text-mut border border-line rounded px-1 py-px ml-1">${p.kind}</span></div>
            <div class="text-xs text-mut truncate max-w-xl">${esc(p.statement_first_line)}</div>
          </td>
          ${inter ? '' : `<td class="px-4 py-2.5 text-mut text-xs">${esc(p.folder_title)}</td>`}
          <td class="px-4 py-2.5 ${DIFF_CLS[p.difficulty]} capitalize">${p.difficulty}</td>
          <td class="px-4 py-2.5 text-mut">${p.time_box_min} min</td>
        </tr>`).join('')}
      </tbody>
    </table>
    ${list.length ? '' : '<div class="p-8 text-center text-mut text-sm">No problems match these filters.</div>'}
    </div>
    <p class="text-xs text-mut mt-3">${list.length} shown · ${inter
      ? 'Interleave on: labels hidden, order reshuffles daily — name the pattern out loud before you open a problem.'
      : 'Tip: once a folder feels comfortable, switch on Interleave — recognizing the pattern unprompted is the actual interview skill.'}</p>`;
  };
  renderTable();
  $('#f-q').oninput = e => { filt.q = e.target.value; renderTable(); };
  $('#f-folder').onchange = e => { filt.folder = e.target.value; renderTable(); };
  $('#f-diff').onchange = e => { filt.diff = e.target.value; renderTable(); };
  $('#f-status').onchange = e => { filt.status = e.target.value; renderTable(); };
  $('#f-inter').onchange = e => { store.set('mlprep.interleave', e.target.checked); viewProblems(app); };
}

/* ------------------------------------------------- view: single problem */
async function viewProblem(app, pid) {
  app.innerHTML = spinner('Loading problem…');
  let p;
  try { p = await api('/api/problem?id=' + encodeURIComponent(pid)); }
  catch (e) { app.innerHTML = errBox(e); return; }

  const itemId = 'app:' + p.id;
  app.innerHTML = `
  <div class="flex h-full">
    <section class="w-1/2 overflow-y-auto border-r border-line p-6">
      <div class="flex items-center gap-3 flex-wrap mb-1">
        <h1 class="text-lg font-bold text-zinc-100 font-mono">${esc(p.name)}</h1>
        <span class="text-xs ${DIFF_CLS[p.difficulty]} capitalize font-semibold">${p.difficulty}</span>
        <span class="text-[10px] text-mut border border-line rounded px-1.5 py-px">${p.kind}</span>
        <span class="text-xs text-mut">${esc(p.folder_title)}</span>
      </div>
      <div class="text-xs text-mut mb-4 font-mono">${esc(p.source_path)}</div>
      <div class="md mb-5">${md(p.statement)}</div>
      ${p.helpers ? `
      <details class="mb-5 bg-panel border border-line rounded-lg px-4 py-2.5">
        <summary class="cursor-pointer text-sm text-zinc-300 font-semibold">Provided helpers (not spoilers)</summary>
        <pre class="mt-2 text-xs font-mono text-zinc-300 overflow-x-auto bg-[#161616] border border-line rounded p-3">${esc(p.helpers)}</pre>
      </details>` : ''}

      <div class="space-y-3">
        <div>
          <button id="btn-hint" class="px-3 py-1.5 rounded-md border border-warn/50 text-warn text-sm hover:bg-warn/10">
            Hint — key insight</button>
          <span class="text-xs text-mut ml-2 italic">stuck? try 10 more minutes first — the struggle is the training signal</span>
          <div id="hint-box" class="hidden mt-2 p-3 rounded-md border-l-4 border-warn bg-warn/5 text-sm md"></div>
        </div>
        <div>
          <button id="btn-sol" class="px-3 py-1.5 rounded-md border border-bad/50 text-bad text-sm hover:bg-bad/10">
            Reference solution</button>
          <div id="sol-confirm" class="hidden mt-2 p-3 rounded-md border border-bad/40 bg-bad/5 text-sm">
            Opening the solution converts this problem into a worked example — you'll need a cold
            re-attempt in 2 days for it to count. A "fail" will be logged to the review queue so the
            re-attempt gets scheduled. Open?
            <div class="mt-2 flex gap-2">
              <button id="btn-sol-no" class="px-3 py-1 rounded border border-line text-zinc-300 hover:bg-panel2">Not yet</button>
              <button id="btn-sol-yes" class="px-3 py-1 rounded bg-bad/80 text-white hover:bg-bad">Open</button>
            </div>
          </div>
          <div id="sol-box" class="hidden mt-2">
            <div id="sol-note" class="text-xs text-warn mb-1"></div>
            <pre class="text-xs font-mono text-zinc-200 overflow-x-auto bg-[#161616] border border-line rounded-lg p-3">${esc(p.solution_source)}</pre>
          </div>
        </div>
      </div>
    </section>

    <section class="w-1/2 flex flex-col min-w-0">
      <div class="flex items-center gap-3 px-4 py-2 border-b border-line bg-panel">
        <button id="btn-run" class="px-4 py-1.5 rounded-md bg-good text-white text-sm font-semibold hover:bg-good/80">
          ▶ Run</button>
        <span class="text-xs text-mut">Cmd/Ctrl+Enter</span>
        <div class="ml-auto flex items-center gap-2 text-sm font-mono">
          <span id="timer" class="text-zinc-300">0:00</span>
          <span class="text-mut text-xs">/ ${p.time_box_min} min box</span>
        </div>
      </div>
      <div id="editor-wrap" class="flex-1 min-h-0 relative"></div>
      <div id="result" class="border-t border-line max-h-[45%] overflow-y-auto"></div>
    </section>
  </div>`;

  /* editor (CodeMirror if the CDN loaded, textarea otherwise) */
  let cmEditor = null;
  if (window.CodeMirror) {
    cmEditor = CodeMirror($('#editor-wrap'), {
      value: p.stub, mode: 'python', lineNumbers: true,
      theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
      indentUnit: 4, tabSize: 4, indentWithTabs: false, autofocus: true,
      extraKeys: { 'Cmd-Enter': () => run(), 'Ctrl-Enter': () => run(),
                   Tab: cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ') },
    });
    window._cm = cmEditor;   // let the theme toggle re-theme a live editor
  } else {
    $('#editor-wrap').innerHTML = `<textarea id="code-ta" spellcheck="false"
      class="w-full h-full bg-[#1e1e1e] text-zinc-200 font-mono text-sm p-3 outline-none resize-none">${esc(p.stub)}</textarea>`;
  }
  const getCode = () => cmEditor ? cmEditor.getValue() : $('#code-ta').value;

  /* timer vs time box */
  const t0 = Date.now(), boxSec = p.time_box_min * 60;
  const tick = () => {
    const el = $('#timer'); if (!el) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    el.textContent = fmtClock(s);
    el.className = s >= boxSec ? 'text-bad font-bold' : s >= boxSec * 0.8 ? 'text-warn' : 'text-zinc-300';
    if (s >= boxSec) el.textContent += '  (box expired — take the hint ladder)';
  };
  const timerIv = setInterval(tick, 1000); tick();

  const keyHandler = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  };
  document.addEventListener('keydown', keyHandler);
  cleanup = () => { clearInterval(timerIv); document.removeEventListener('keydown', keyHandler); };

  /* progressive disclosure, tutor-ordered: hint first, then gated solution */
  $('#btn-hint').onclick = () => {
    const box = $('#hint-box');
    box.classList.remove('hidden');
    box.innerHTML = p.key_insight ? md(p.key_insight)
      : '<i>No separate key-insight note for this one — the reference solution is the next rung.</i>';
    $('#btn-hint').disabled = true; $('#btn-hint').classList.add('opacity-50');
  };
  $('#btn-sol').onclick = () => $('#sol-confirm').classList.toggle('hidden');
  $('#btn-sol-no').onclick = () => $('#sol-confirm').classList.add('hidden');
  $('#btn-sol-yes').onclick = async () => {
    $('#sol-confirm').classList.add('hidden');
    $('#sol-box').classList.remove('hidden');
    $('#btn-sol').disabled = true; $('#btn-sol').classList.add('opacity-50');
    try {
      const r = await api('/api/log', { item_id: itemId, source_path: p.source_path, result: 'fail' });
      $('#sol-note').textContent = `Logged as a miss — cold re-attempt scheduled for ${r.row.due}.`;
      problemsCache = null; updateNavProgress();
    } catch (e) { $('#sol-note').textContent = 'Could not log to queue: ' + e.message; }
  };

  /* run + verdict */
  async function run() {
    const btn = $('#btn-run'); if (!btn || btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Running…';
    $('#result').innerHTML = `<div class="p-4 text-sm text-mut animate-pulse">Judging — your ${esc(p.kind)} is swapped into
      ${esc(p.source_path)} and the file's full assert suite runs (30 s limit)…</div>`;
    let r;
    try { r = await api('/api/run', { id: p.id, code: getCode() }); }
    catch (e) { $('#result').innerHTML = errBox(e); btn.disabled = false; btn.textContent = '▶ Run'; return; }
    btn.disabled = false; btn.textContent = '▶ Run';
    const solveSec = Math.floor((Date.now() - t0) / 1000);
    if (r.ok) {
      $('#result').innerHTML = `
      <div class="p-4">
        <div class="p-3 rounded-lg bg-good/15 border border-good/40 text-good font-semibold text-sm">
          ✓ Accepted — full suite passed (${r.asserts} asserts) · judge ${r.elapsed_ms} ms · you ${fmtClock(solveSec)}
        </div>
        ${r.output ? `<pre class="mt-2 text-xs font-mono text-mut">${esc(r.output.trim())}</pre>` : ''}
        <div class="mt-3 flex items-center gap-3">
          <button id="btn-logpass" class="px-3 py-1.5 rounded-md bg-good/80 text-white text-sm hover:bg-good">
            Log pass to review queue</button>
          <span id="log-note" class="text-xs text-mut"></span>
        </div>
      </div>`;
      $('#btn-logpass').onclick = () => logResult('pass');
    } else {
      $('#result').innerHTML = `
      <div class="p-4">
        <div class="p-3 rounded-lg bg-bad/15 border border-bad/40 text-bad font-semibold text-sm">✗ Rejected</div>
        <pre class="mt-2 p-3 text-xs font-mono text-zinc-300 bg-[#161616] border border-line rounded-lg overflow-auto max-h-64 whitespace-pre-wrap">${esc(r.error || 'no error output')}</pre>
        <div class="mt-3 flex items-center gap-3">
          <button id="btn-logfail" class="px-3 py-1.5 rounded-md bg-bad/80 text-white text-sm hover:bg-bad">
            Log fail (schedules re-attempt)</button>
          <span id="log-note" class="text-xs text-mut"></span>
        </div>
      </div>`;
      $('#btn-logfail').onclick = () => logResult('fail');
    }
  }
  async function logResult(result) {
    const note = $('#log-note');
    try {
      const r = await api('/api/log', { item_id: itemId, source_path: p.source_path, result });
      note.textContent = `Logged "${result}" — next due ${r.row.due} (interval ${r.row.interval_days}d).`;
      const b = $('#btn-logpass') || $('#btn-logfail');
      if (b) { b.disabled = true; b.classList.add('opacity-50'); }
      problemsCache = null; updateNavProgress();
    } catch (e) { note.textContent = 'Log failed: ' + e.message; }
  }
  $('#btn-run').onclick = () => run();
}

/* ------------------------------------------------------------ view: notes */
async function viewNotes(app, encodedPath) {
  app.innerHTML = spinner('Loading notes tree…');
  let tree;
  try { tree = await api('/api/tree'); } catch (e) { app.innerHTML = errBox(e); return; }
  const current = encodedPath ? decodeURIComponent(encodedPath) : null;

  app.innerHTML = `
  <div class="flex h-full">
    <aside class="w-80 shrink-0 overflow-y-auto border-r border-line bg-panel/50 p-3 text-sm">
      ${tree.map(g => `
        <div class="mb-3">
          <div class="px-2 py-1 text-[11px] uppercase tracking-widest text-accent font-bold">${esc(g.group)}</div>
          ${g.folders.map(f => `
            <details ${f.files.some(x => x.path === current) ? 'open' : ''} class="ml-1">
              <summary class="px-2 py-1 cursor-pointer text-zinc-400 hover:text-zinc-200 text-xs font-mono">${esc(f.name)}</summary>
              ${f.files.map(x => `
                <a href="#/notes/${encodeURIComponent(x.path)}"
                   class="block ml-3 px-2 py-1 rounded truncate ${x.path === current ? 'bg-panel2 text-accent' : 'text-zinc-300 hover:bg-panel2'}"
                   title="${esc(x.path)}">${esc(x.title)}</a>`).join('')}
            </details>`).join('')}
        </div>`).join('')}
    </aside>
    <section id="notes-body" class="flex-1 overflow-y-auto p-8">
      ${current ? spinner('Loading file…') : `<div class="text-mut text-sm mt-10 text-center">
        Pick a file — exit-checklist checkboxes are saved locally (browser only), never written back to the repo.</div>`}
    </section>
  </div>`;

  if (!current) return;
  let doc;
  try { doc = await api('/api/md?path=' + encodeURIComponent(current)); }
  catch (e) { $('#notes-body').innerHTML = errBox(e); return; }
  $('#notes-body').innerHTML =
    `<div class="max-w-3xl mx-auto md" id="md-root">${md(doc.content)}</div>`;
  /* checklists: real checkboxes, state in localStorage per file (UI-only) */
  const key = 'mlprep.checks.' + current;
  const saved = store.get(key, {});
  $$('#md-root input[type=checkbox]').forEach((cb, i) => {
    cb.disabled = false;
    if (i in saved) cb.checked = !!saved[i];
    cb.addEventListener('change', () => {
      const cur = store.get(key, {});
      cur[i] = cb.checked;
      store.set(key, cur);
    });
  });
}

/* ------------------------------------------------------------ view: cards */
async function viewCards(app, slug) {
  app.innerHTML = spinner('Loading flashcards…');
  let cards;
  try { cards = await getCards(); } catch (e) { app.innerHTML = errBox(e); return; }
  const sections = [...new Map(cards.map(c => [c.slug, c.section])).entries()];

  if (!slug) {
    app.innerHTML = `
    <div class="max-w-3xl mx-auto p-8">
      <h1 class="text-xl font-bold mb-1">Flashcards</h1>
      <p class="text-sm text-mut mb-6">${cards.length} cards. Answer <b>out loud</b> before flipping —
        a hesitation counts as a miss. Misses are logged to the review queue.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${sections.map(([s, title]) => {
          const n = cards.filter(c => c.slug === s).length;
          return `<a href="#/cards/${esc(s)}" class="block p-4 rounded-lg bg-panel border border-line hover:border-accent">
            <div class="font-semibold text-zinc-100">${esc(title)}</div>
            <div class="text-xs text-mut mt-1">${n} cards</div></a>`;
        }).join('')}
      </div>
    </div>`;
    return;
  }

  const deck = cards.filter(c => c.slug === slug);
  if (!deck.length) { app.innerHTML = errBox(new Error('unknown section: ' + slug)); return; }
  const state = { i: 0, flipped: false, got: 0, missed: [], logNote: '' };

  const render = () => {
    if (state.i >= deck.length) {
      app.innerHTML = `
      <div class="max-w-xl mx-auto p-10 text-center">
        <h1 class="text-xl font-bold mb-2">Deck complete</h1>
        <p class="text-sm text-mut mb-4">${esc(deck[0].section)}</p>
        <div class="text-4xl font-bold mb-1 ${state.missed.length ? 'text-warn' : 'text-good'}">
          ${state.got}/${deck.length}</div>
        <p class="text-sm text-mut mb-6">got it — ${state.missed.length} missed
          ${state.missed.length ? '(each logged to the queue for a re-attempt)' : ''}</p>
        ${state.missed.length ? `<div class="text-left text-sm bg-panel border border-line rounded-lg p-4 mb-6">
          <div class="text-xs uppercase tracking-wider text-mut mb-2">Missed</div>
          <ul class="list-disc ml-5 space-y-1">${state.missed.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>` : ''}
        <div class="flex gap-3 justify-center">
          <button id="c-restart" class="px-4 py-2 rounded-md border border-line hover:bg-panel2 text-sm">Restart deck</button>
          <a href="#/cards" class="px-4 py-2 rounded-md bg-accent text-black font-semibold text-sm">All sections</a>
        </div>
      </div>`;
      $('#c-restart').onclick = () => { state.i = 0; state.flipped = false; state.got = 0; state.missed = []; render(); };
      return;
    }
    const c = deck[state.i];
    app.innerHTML = `
    <div class="max-w-2xl mx-auto p-8 relative">
      <div class="flex items-baseline justify-between mb-4">
        <a href="#/cards" class="text-xs text-mut hover:text-accent">← sections</a>
        <div class="text-sm text-mut">${esc(c.section)} · <b class="text-zinc-200">${state.i + 1}/${deck.length}</b></div>
      </div>
      <div id="card" class="cursor-pointer select-none rounded-xl border ${state.flipped ? 'border-accent/60' : 'border-line'}
           bg-panel p-8 min-h-[16rem] flex flex-col justify-center" title="click or Space to flip">
        <div class="text-[11px] uppercase tracking-widest ${state.flipped ? 'text-accent' : 'text-mut'} mb-3">
          ${state.flipped ? 'Answer' : 'Question'}</div>
        ${state.flipped
          ? `<div class="md text-[.95rem]">${md(c.answer)}</div>`
          : `<div class="text-lg font-medium leading-relaxed">${esc(c.question)}</div>`}
      </div>
      <div class="mt-4 flex items-center gap-3 ${state.flipped ? '' : 'invisible'}">
        <button id="c-miss" class="px-4 py-2 rounded-md bg-bad/80 hover:bg-bad text-white text-sm font-semibold">✗ Missed (1)</button>
        <button id="c-got" class="px-4 py-2 rounded-md bg-good/80 hover:bg-good text-white text-sm font-semibold">✓ Got it (2)</button>
        <span class="text-xs text-mut">${esc(state.logNote)}</span>
        <span class="ml-auto text-[11px] text-mut italic">grade before you flip back — recognition is not recall</span>
      </div>
    </div>`;
    $('#card').onclick = () => { state.flipped = !state.flipped; render(); };
    if (state.flipped) {
      $('#c-miss').onclick = e => { e.stopPropagation(); grade('fail'); };
      $('#c-got').onclick = e => { e.stopPropagation(); grade('pass'); };
    }
  };
  const grade = (result) => {
    const c = deck[state.i];
    if (result === 'pass') state.got++; else state.missed.push(c.question);
    state.logNote = '';
    api('/api/log', { item_id: `card:${c.slug}#${c.n}`, source_path: 'practice/flashcards.md', result })
      .catch(e => { state.logNote = 'queue log failed: ' + e.message; render(); });
    state.i++; state.flipped = false; render();
  };
  const keyHandler = e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); if (state.i < deck.length) { state.flipped = !state.flipped; render(); } }
    else if (state.flipped && e.key === '1') grade('fail');
    else if (state.flipped && e.key === '2') grade('pass');
  };
  document.addEventListener('keydown', keyHandler);
  cleanup = () => document.removeEventListener('keydown', keyHandler);
  render();
}

/* ----------------------------------------------------------- view: review */
async function viewReview(app) {
  app.innerHTML = spinner('Loading review queue…');
  let q;
  try { q = await api('/api/queue'); } catch (e) { app.innerHTML = errBox(e); return; }
  const due = q.due_today, maxBar = Math.max(1, ...q.histogram.map(h => h.count));

  const dueRow = r => {
    const isApp = r.item_id.startsWith('app:');
    const label = `<span class="font-mono text-sm">${esc(r.item_id)}</span>`;
    return `<div class="flex items-center gap-3 px-4 py-2.5 border-t border-line hover:bg-panel2">
      <span class="text-xs font-mono ${r.due < q.today ? 'text-bad' : 'text-warn'}">${esc(r.due)}</span>
      ${isApp
        ? `<a class="text-accent hover:underline" href="#/problem/${esc(r.item_id.slice(4))}">${label}</a>`
        : label}
      <span class="text-xs text-mut ml-auto font-mono">${esc(r.source_path)}</span>
      <span class="text-xs text-mut w-10 text-right">${esc(r.interval_days)}d</span>
    </div>`;
  };

  app.innerHTML = `
  <div class="max-w-4xl mx-auto p-8">
    <h1 class="text-xl font-bold mb-5">Review dashboard</h1>

    <div class="p-5 rounded-xl border ${due.length ? 'border-accent bg-accent/10' : 'border-good/50 bg-good/10'} mb-6">
      <div class="text-[11px] uppercase tracking-widest ${due.length ? 'text-accent' : 'text-good'} font-bold mb-1">What to do now</div>
      ${due.length
        ? `<div class="text-lg font-semibold">Clear your queue first — ${due.length} item${due.length > 1 ? 's' : ''} due.</div>
           <div class="text-sm text-mut mt-1">Attempt each cold (blank page, timer on), then log pass/fail.
           Retrieval right before forgetting is where the gains are.</div>`
        : `<div class="text-lg font-semibold">Queue clear. Pull one interleaved set or a flashcard section.</div>
           <div class="text-sm text-mut mt-1">
             <a class="text-accent hover:underline" href="#/problems"
                onclick="store.set('mlprep.interleave', true)">Problems with Interleave on</a> ·
             <a class="text-accent hover:underline" href="#/cards">flashcards</a></div>`}
    </div>

    <div class="grid grid-cols-3 gap-4 mb-6 text-center">
      <div class="p-4 rounded-lg bg-panel border border-line">
        <div class="text-2xl font-bold ${due.length ? 'text-warn' : 'text-good'}">${due.length}</div>
        <div class="text-xs text-mut mt-1">due today (or overdue)</div></div>
      <div class="p-4 rounded-lg bg-panel border border-line">
        <div class="text-2xl font-bold text-zinc-100">${q.reviewed_today}</div>
        <div class="text-xs text-mut mt-1">items reviewed today</div></div>
      <div class="p-4 rounded-lg bg-panel border border-line">
        <div class="text-2xl font-bold text-zinc-100">${q.rows.length}</div>
        <div class="text-xs text-mut mt-1">items in the queue</div></div>
    </div>

    <div class="border border-line rounded-lg overflow-hidden mb-6">
      <div class="px-4 py-2.5 bg-panel text-xs uppercase tracking-wider text-mut">Due list</div>
      ${due.length ? due.map(dueRow).join('')
        : '<div class="px-4 py-6 border-t border-line text-sm text-mut text-center">Nothing due. Consolidation needs the gap — don\'t review early.</div>'}
    </div>

    <div class="border border-line rounded-lg overflow-hidden">
      <div class="px-4 py-2.5 bg-panel text-xs uppercase tracking-wider text-mut">
        Interval histogram <span class="normal-case">(right = closer to mastered; pass doubles the interval, cap 16d)</span></div>
      <div class="p-4 space-y-2">
        ${q.histogram.map(h => `
          <div class="flex items-center gap-3 text-xs">
            <span class="w-12 text-right font-mono text-mut">≤${h.interval}d</span>
            <div class="flex-1 h-4 bg-panel2 rounded overflow-hidden">
              <div class="h-full ${h.interval >= 8 ? 'bg-good' : h.interval >= 4 ? 'bg-warn' : 'bg-accent'}"
                   style="width:${100 * h.count / maxBar}%"></div></div>
            <span class="w-6 font-mono text-mut">${h.count}</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}
</script>
